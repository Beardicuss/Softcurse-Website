const TIMELINE=[
  {id:"TET-B4-31",en:"The negotiation between Dante and Ur-Gan within the Silence sphere is the first time in the narrative that the Silence has been used as a diplomatic environment rather than as a tactical tool. By creating a sphere where magic is suppressed, Dante leveled the negotiating field — the High Shaman's staff, drums, and ritual instruments were neutralized, removing his primary demonstration capability. Dante's demonstration capability (the Silence itself) was already deployed as the sphere's structure. This is the same asymmetry as the Observer's Trap solution: Dante did not defeat the opposition's tool. He made the tool irrelevant. Ur-Gan recognized this. His decision to sit was a decision to engage in Dante's framework rather than his own.",ru:"Переговоры между Данте и Ур-Ганом внутри сферы Тишины — первый раз в нарративе когда Тишина использовалась как дипломатическая среда а не тактический инструмент. Создав сферу где магия подавлена, Данте выровнял переговорное поле — посох Верховного Шамана, барабаны и ритуальные инструменты были нейтрализованы, устраняя его основную возможность демонстрации. Возможность демонстрации Данте (сама Тишина) уже была развёрнута как структура сферы. Это та же асимметрия что решение Ловушки Наблюдателя: Данте не победил инструмент противника. Он сделал инструмент нерелевантным."},
  {id:"TET-B4-32",en:"The Gel 'twin' detonator system — sympathetic quantum coupling between two samples cast from the same batch — is a concept from Isabella's synthesis research that has not previously appeared in the narrative. It represents the first application of the Gel's molecular entanglement property as a communication mechanism rather than as an integration substrate. The system works because Gel samples from the same casting event share a resonance baseline: changes to one propagate to the other instantaneously. Isabella described this as 'quantum coupling.' The correct technical description in the Pale Echelon documentation is 'coherent null-field entanglement.' The Chaos-field's assimilation of the Gel converted both samples simultaneously — proof that the entanglement was still active during the Cave Heart's information-beam contact.",ru:"Система детонатора Гель-«близнецов» — симпатическая квантовая связь между двумя образцами отлитыми из одной партии — концепция из синтетического исследования Изабеллы ранее не появлявшаяся в нарративе. Она представляет первое применение свойства молекулярного запутывания Геля как коммуникационного механизма а не как интеграционного субстрата. Система работает, потому что образцы Геля из одного события отливки разделяют резонансный базовый уровень: изменения одного распространяются к другому мгновенно. Ассимиляция поля Хаоса Геля конвертировала оба образца одновременно — доказательство что запутывание было ещё активным во время контакта информационного луча Сердца Пещеры."},
  {id:"TET-B4-33",en:"'You... Fragment. You returned. To become whole?' — The Cave Heart's recognition of Dante during the retreat is the most significant revelation of the narrative to date. The Chaos-field source recognized the composite as a fragment of a larger system — a component that was separated from its origin. This is consistent with the Series 404 specification as described in Lucius's knowledge: the Series 404 was designed to become something complete when integration is finished. The Cave Heart's identification of Dante as a 'Fragment' indicates that the Covenant infrastructure — including its Chaos-field components — recognizes the Series 404 composite as belonging to a parent system. The parent system is not the Island of Silence, which was destroyed. It is the Ark.",ru:"«Ты... Осколок. Ты вернулся. Чтобы стать целым?» — Узнавание Данте Сердцем Пещеры во время отступления — наиболее значительное откровение нарратива на сегодняшний день. Источник поля Хаоса узнал композит как фрагмент большей системы — компонент отделённый от своего происхождения. Это согласуется со спецификацией серии 404 описанной в знании Люция: серия 404 была разработана стать чем-то завершённым когда интеграция закончена. Идентификация Данте Сердцем Пещеры как «Осколка» указывает что инфраструктура Завета — включая её компоненты поля Хаоса — узнаёт композит серии 404 как принадлежащий родительской системе. Родительская система — не Остров Тишины который был уничтожен. Это Ковчег."},
  {id:"TET-B4-34",en:"'The Gel didn't work because it was dead Order. Static. Chaos is alive. To kill it... we need living Order.' — This is the most operationally important conclusion Dante has reached in the narrative. Dead Gel — pre-prepared, static, manufactured — is a substrate, not a process. The Chaos-field can assimilate a substrate because a substrate does not resist. Living Order — a Gel that is actively integrated with a biological or Covenant-operational system — is a process. A process interacts rather than being absorbed. The 'living Order' Dante is describing is, structurally, what the composite already is: a Gel that is actively integrated with his biological architecture and continuously producing the null-field resonance. He is not yet describing himself as the solution. He is describing the solution in terms that accurately describe himself.",ru:"«Гель не сработал, потому что он был мёртвым Порядком. Статичным. А Хаос — живой. Чтобы убить его... нам нужен живой Порядок». — Это наиболее операционно важный вывод которого достиг Данте в нарративе. Мёртвый Гель — предварительно подготовленный, статичный, производственный — это субстрат, не процесс. Поле Хаоса может ассимилировать субстрат, потому что субстрат не сопротивляется. Живой Порядок — Гель активно интегрированный с биологической или операционной системой Завета — это процесс. Процесс взаимодействует а не поглощается. «Живой Порядок» который описывает Данте структурно то чем уже является композит: Гель активно интегрированный с его биологической архитектурой и непрерывно производящий нулевой резонанс. Он ещё не описывает себя как решение."},
  {id:"TET-B4-35",en:"The Auditor-memory's counter-scan during the Cave Heart's recognition event — 'while the Heart was scanning him, the Auditor-Memory made a reciprocal scan' — produced the Cave Heart's resonance frequency, structural data, and vibration pattern. This data is the operational foundation for 'building a cage,' which is what Dante says he intends to do in the chapter's final lines. The data acquisition is not incidental. It is the only successful outcome of the failed operation. He went in with a weapon and came out with intelligence. The intelligence is more valuable than the weapon would have been, because it allows precision interaction rather than blunt-force application.",ru:"Контрсканирование архива Аудитора во время события узнавания Сердца Пещеры — «пока Сердце сканировало его, Память Аудитора сделала ответный снимок» — произвело резонансную частоту Сердца Пещеры, структурные данные и паттерн вибрации. Эти данные — операционная основа для «построения клетки» что и намерен сделать Данте в финальных строках главы. Приобретение данных не случайно. Это единственный успешный результат провалившейся операции. Он вошёл с оружием и вышел с разведкой. Разведка ценнее чем было бы оружие, потому что позволяет точное взаимодействие а не грубое применение силы."}
];

const SCENES=[
{id:"s1",
 title:{en:"Negotiations at the Freezing Point",ru:"Переговоры в Точке Замерзания"},
 subtitle:{en:"Here the spirits are silent. Here only physics. Sit down, Ur-Gan. The conversation will be long.",ru:"Здесь Духи молчат. Здесь только физика. Садитесь, Ур-Ган. Разговор будет долгим."},
 location:{en:"Outpost-7 — Inside the Silence Sphere",ru:"Форпост-7 — Внутри Сферы Тишины"},
 timing:{en:"Morning — After the Standoff",ru:"Утро — После Противостояния"},
 flags:["pivotal","revelation"],
 povData:{
   dante:{distortion:4,
     text:{
       en:`The negotiation framework was established the moment I chose to use the Silence as the meeting environment.\n\nA sphere of Silence within a contested zone does three things simultaneously: it protects the people inside from external escalation, it neutralizes the other party's primary demonstration capability, and it establishes that I can deploy my capability at will while theirs requires external conditions I have removed. Ur-Gan is not unintelligent. He recognized the asymmetry before he sat down.\n\nHis refusal of the chair was the correct response to the power dynamic — a person who accepts the offered seat concedes ground. His eventual acceptance was the correct response to the situation — a person who refuses to negotiate does not survive. He chose survival. Good.\n\nThe Corridor of Decisions: Option A, Option B. I have been using this framework since Chapter 1. The structure is always the same: one option that preserves the status quo at unacceptable cost, one option that requires cooperation with me at a cost I have already decided I can deliver. The framework works because it converts a complex situation into a binary choice, and binary choices are solvable.\n\nWhat I did not tell Ur-Gan: I don't have a third option in reserve. Options A and B are the actual options. If he had chosen A — hold the ice and wait — I would have needed to find something else in approximately two days. I do not have something else.\n\nHe chose B.\n\nThe blood compact: I accepted it without hesitation because hesitation would have been read as reluctance, and reluctance would have undermined the authority frame I had been constructing through the entire negotiation. The Shaman's blood on my glove is a cost I can sustain. The cost I cannot sustain is appearing negotiable on terms that are already settled.\n\nGrimm's 'Acid Storm' modified Gel. Isabella's Scavenger with the Gel capsule. The sympathetic detonator system.\n\nI said: this is an experiment.\n\nThis was true. I have never attempted to introduce a controlled-Gel payload into an active Chaos-field source using a biological delivery vehicle triggered by sympathetic resonance coupling.\n\nNo one has. There is no precedent in the archive.\n\nI said this to Ur-Gan. He agreed to cooperate anyway. He is braver than I expected, or more desperate, or both.\n\nBusiness continues.`,
       ru:`Переговорная рамка была установлена в момент когда я выбрал использовать Тишину как среду встречи.\n\nСфера Тишины в оспариваемой зоне делает три вещи одновременно: защищает людей внутри от внешней эскалации, нейтрализует основную возможность демонстрации другой стороны, и устанавливает что я могу развернуть свою возможность по желанию пока их требует внешних условий которые я устранил. Ур-Ган не неумён. Он узнал асимметрию прежде чем сел.\n\nЕго отказ от стула был верным ответом на динамику власти — человек принимающий предложенное место уступает позицию. Его конечное принятие было верным ответом на ситуацию — человек отказывающийся вести переговоры не выживает. Он выбрал выживание. Хорошо.\n\nКоридор Решений: Вариант А, Вариант Б. Я использую эту рамку с Главы 1. Структура всегда одинакова: один вариант сохраняющий статус-кво по неприемлемой цене, один вариант требующий сотрудничества со мной по цене которую я уже решил что могу обеспечить. Рамка работает, потому что конвертирует сложную ситуацию в бинарный выбор, а бинарные выборы решаемы.\n\nЧего я не говорил Ур-Гану: у меня нет третьего варианта в резерве. Варианты А и Б — реальные варианты. Если бы он выбрал А — держать лёд и ждать — мне нужно было бы найти что-то ещё приблизительно за два дня. У меня нет чего-то ещё.\n\nОн выбрал Б.\n\nКровяной уговор: я принял его без колебаний, потому что колебание было бы прочитано как нежелание, а нежелание подорвало бы авторитетную рамку которую я строил через все переговоры. Кровь Шамана на моей перчатке — стоимость которую я могу понести. Стоимость которую я не могу понести — казаться договорным на условиях которые уже урегулированы.\n\nЯ сказал: это эксперимент.\n\nЭто было правдой. Я никогда не пытался ввести полезную нагрузку контролируемого Геля в активный источник поля Хаоса используя биологическое транспортное средство активируемое симпатической резонансной связью.\n\nНикто не пытался. В архиве нет прецедента.\n\nЯ сказал это Ур-Гану. Он всё равно согласился сотрудничать. Он храбрее чем я ожидал, или более отчаян, или и то и другое.\n\nБизнес продолжается.`
     },
     knows:{en:["There is no third option. Options A and B are the actual options. If Ur-Gan had chosen A, Dante had approximately two days to find something else. He does not have something else.","The blood compact was accepted without hesitation to preserve the authority frame — appearing negotiable on already-settled terms is the cost he cannot sustain.","He told Ur-Gan this is an experiment. No precedent in the archive. Ur-Gan agreed anyway."],ru:["Нет третьего варианта. Варианты А и Б — реальные. Если бы Ур-Ган выбрал А, у Данте было приблизительно два дня найти что-то ещё. У него нет чего-то ещё.","Кровяной уговор принят без колебаний чтобы сохранить авторитетную рамку — казаться договорным на уже урегулированных условиях — стоимость которую нельзя понести.","Он сказал Ур-Гану что это эксперимент. Нет прецедента в архиве. Ур-Ган согласился всё равно."]},
     misunderstands:{en:["He said 'I have never attempted this. No one has. There is no precedent in the archive.' He filed this as an honest disclosure to Ur-Gan. He has not examined whether the absence of precedent in the donor-memory archive is itself informative. The Pale Echelon documentation describes approaches to secondary sites under various conditions. The absence of documentation for 'introduce a Gel payload into a Chaos-field source' may mean this approach was never attempted because it was known to fail — not because it was untried."],ru:["Он сказал «я никогда не пытался это. Никто не пытался. В архиве нет прецедента». Он занёс это как честное раскрытие Ур-Гану. Он не исследовал является ли само отсутствие прецедента в архиве донорской памяти информативным. Документация Бледного Эшелона описывает подходы к вторичным объектам в различных условиях. Отсутствие документации для «введения полезной нагрузки Геля в источник поля Хаоса» может означать что этот подход никогда не пытались, потому что было известно что он провалится — не потому что не пробовали."]},
     hides:{en:["He said 'he is braver than I expected, or more desperate, or both.' He filed Ur-Gan's cooperation as a psychological assessment. He has not filed his own cooperation with Ur-Gan's blood compact — the physical act of accepting another person's blood as a binding token. He has given his word in blood before (not literally). He has not examined what it means to bind himself to a person who said: if your plan fails, I will personally cut your throat. He accepted this as a contractual term. He has not examined whether 'accepted as a contractual term' is the whole story of how that specific exchange landed."],ru:["Он сказал «он храбрее чем я ожидал, или более отчаян, или и то и другое». Он занёс сотрудничество Ур-Гана как психологическую оценку. Он не занёс собственное сотрудничество с кровяным уговором Ур-Гана — физический акт принятия крови другого человека как обязывающего знака. Он принял это как договорный условие. Он не исследовал является ли «принято как договорный условие» всей историей того как этот конкретный обмен приземлился."]},
     whisper:{en:"No third option exists. The experiment had no archive precedent. He accepted the blood compact as a term. He did not examine how it landed.",ru:"Третьего варианта не существует. Эксперимент не имел прецедента в архиве. Он принял кровяной уговор как условие. Он не исследовал как это приземлилось."}
   },
   ur_gan:{distortion:5,
     text:{
       en:`I have lived at the boundary for sixty-three years.\n\nMy father lived at the boundary. His father. Back to the First Keeper, who was the last one to speak with the Sleeping One's voice before it fell silent two thousand winters ago. We do not know what the Sleeping One is. We know what it does. When the boundary holds, the valley lives. When the boundary fails, the valley dies. That is the whole of our theology.\n\nThe Iron Man's sphere.\n\nWhen he created it, the spirits went quiet. Not violently. They simply... withdrew. Like sound absorbed by deep snow. I have never experienced silence in that way before. My whole life has been filled with the voice of the land — the hum of the deep ice, the whisper of the mountain's bones, the specific resonance of the boundary's membrane when it vibrates under pressure.\n\nInside his sphere: nothing. Not death. Not emptiness. A complete absence of the voice I have been hearing since birth.\n\nHe called it 'physics.' I do not know this word. But I understood what he meant: a place where the language of spirits cannot speak, and only the language of stones and levers applies.\n\nHe was comfortable there. I was not.\n\nHis plan: feed the Scavenger to the Sleeping One with a poison inside it. The poison is Structural Gel. The blood of stars.\n\nI knew he was wrong before he finished explaining. The Sleeping One does not eat things that do not belong to it. It eats things that call to it. The Scavenger calls to it because the Scavenger is made from the same confusion — flesh and iron mixed in the wrong ratio. The Gel calls to it because Gel is the breath of the deep infrastructure, and the Sleeping One is the wound in that infrastructure.\n\nBut I said nothing. Not because I agreed. Because I calculated.\n\nHe has two days before the Sleeping One grows strong enough to break through the ice I have set. I have forty-three people left who can maintain the barrier rhythm. They are tired. The rhythm is degrading. In two days I have perhaps forty hours of functional barrier left.\n\nHe offered me Option B. Die trying.\n\nThis is the same option my grandfather chose when the last great breach happened, three hundred years ago. He died. But he slowed the Sleeping One enough for the following generation to learn the new sealing rhythm.\n\nI am not afraid to die.\n\nBut I would prefer to see whether this Iron Man's failure teaches me something I can use.\n\nThe blood compact was necessary. He needed to know I was serious. I needed to know he would follow through when the plan broke. Men who make only clean agreements do not survive the north.\n\nHis plan will fail.\n\nWhen it fails, we will see what he does next.\n\nThat is what I agreed to watch.`,
       ru:`Я прожил на границе шестьдесят три года.\n\nМой отец жил на границе. Его отец. До самого Первого Хранителя, который был последним кто говорил с голосом Спящего до того как он замолчал две тысячи зим назад. Мы не знаем что такое Спящий. Мы знаем что он делает. Когда барьер держится, долина живёт. Когда барьер рушится, долина умирает. Это вся наша теология.\n\nСфера Железного Человека.\n\nКогда он её создал, духи замолчали. Не насильственно. Они просто... отступили. Как звук поглощаемый глубоким снегом. Я никогда прежде не испытывал тишины таким образом. Вся моя жизнь была наполнена голосом земли — гудением глубокого льда, шёпотом костей горы, специфическим резонансом мембраны барьера когда она вибрирует под давлением.\n\nВнутри его сферы: ничего. Не смерть. Не пустота. Полное отсутствие голоса который я слышу с рождения.\n\nОн назвал это «физикой». Я не знаю этого слова. Но я понял что он имел в виду: место где язык духов не может говорить, и применяется только язык камней и рычагов.\n\nОн был там в своей стихии. Я нет.\n\nЕго план: скормить Падальщика Спящему с ядом внутри. Яд — Структурный Гель. Кровь звёзд.\n\nЯ знал что он неправ прежде чем он закончил объяснять. Спящий не ест вещи которые ему не принадлежат. Он ест вещи которые к нему взывают. Падальщик взывает к нему, потому что Падальщик сделан из той же путаницы — плоть и железо смешанные в неправильном соотношении. Гель взывает к нему, потому что Гель — дыхание глубинной инфраструктуры, а Спящий — рана в этой инфраструктуре.\n\nНо я ничего не сказал. Не потому что согласился. Потому что рассчитал.\n\nУ него два дня до того как Спящий станет достаточно сильным чтобы пробить лёд который я установил. У меня осталось сорок три человека которые могут поддерживать ритм барьера. Они устали. Ритм деградирует. За два дня у меня осталось, возможно, сорок часов функционального барьера.\n\nОн предложил мне Вариант Б. Умереть пытаясь.\n\nЭто тот же вариант который выбрал мой дед когда произошло последнее великое нарушение, триста лет назад. Он умер. Но он замедлил Спящего достаточно чтобы следующее поколение выучило новый ритм запечатывания.\n\nЯ не боюсь умереть.\n\nНо я предпочёл бы посмотреть научит ли меня провал Железного Человека чему-то что я могу использовать.\n\nКровяной уговор был необходим. Ему нужно было знать что я серьёзен. Мне нужно было знать что он продолжит когда план сломается. Люди заключающие только чистые соглашения не выживают на севере.\n\nЕго план провалится.\n\nКогда провалится, мы увидим что он делает следующим.\n\nЭто то что я согласился наблюдать.`
     },
     knows:{en:["He knew the plan would fail before Dante finished explaining: the Sleeping One does not eat things that don't belong to it — it eats things that call to it. Both the Scavenger (flesh and iron in wrong ratio) and the Gel (breath of the deep infrastructure) call to it.","He said nothing because he calculated: 40 hours of functional barrier remaining, 43 people maintaining the rhythm and tiring. He agreed to Option B to observe what Dante does when the plan fails.","'Men who make only clean agreements do not survive the north.' He accepted the blood compact on those terms."],ru:["Он знал что план провалится до того как Данте закончил объяснять: Спящий не ест вещи которые ему не принадлежат — он ест вещи которые к нему взывают. И Падальщик и Гель взывают к нему.","Он ничего не сказал, потому что рассчитал: осталось 40 часов функционального барьера, 43 человека поддерживают ритм и устают. Он согласился на Вариант Б чтобы наблюдать что Данте делает когда план ломается.","«Люди заключающие только чистые соглашения не выживают на севере». Он принял кровяной уговор на этих условиях."]},
     misunderstands:{en:["He believes the plan will fail because 'the Sleeping One eats things that call to it.' He is correct about the mechanism. He has not modeled the second half of what happens: when the Sleeping One scans Dante during the evacuation, it identifies the composite as a 'Fragment.' A Fragment of the Covenant infrastructure — the same infrastructure that the Sleeping One is a wound in. The Sleeping One's recognition of Dante as a Fragment changes the interaction dynamic from 'entity consuming external material' to 'damaged system recognizing a compatible component.' Ur-Gan has modeled the consumption outcome. He has not modeled the recognition outcome."],ru:["Он считает что план провалится, потому что «Спящий ест вещи которые к нему взывают». Он прав о механизме. Он не моделировал вторую половину того что происходит: когда Спящий сканирует Данте во время эвакуации, он идентифицирует композит как «Осколок». Осколок инфраструктуры Завета — той же инфраструктуры в которой Спящий является раной. Узнавание Данте Спящим как Осколка меняет динамику взаимодействия от «сущности поглощающей внешний материал» к «повреждённой системе узнающей совместимый компонент»."]},
     hides:{en:["He said 'his plan will fail. When it fails, we will see what he does next. That is what I agreed to watch.' He has been a boundary keeper for sixty-three years. He has seen every form of failure at the boundary. He agreed to cooperate not because he believed the plan would work, but because watching how a person responds to failure at the boundary tells him more about that person than watching them succeed. He is evaluating Dante. The evaluation outcome determines whether he offers Dante the information that the First Keeper's oral tradition contains about the Sleeping One's original nature."],ru:["Он сказал «его план провалится. Когда провалится, мы увидим что он делает следующим. Это то что я согласился наблюдать». Он хранитель границы шестьдесят три года. Он видел все формы провала на границе. Он согласился сотрудничать не потому что верил что план сработает, а потому что наблюдение как человек отвечает на провал у границы говорит ему больше о человеке чем наблюдение как он добивается успеха. Он оценивает Данте. Результат оценки определяет предложит ли он Данте информацию которую устная традиция Первого Хранителя содержит о первоначальной природе Спящего."]},
     whisper:{en:"He knew it would fail. He agreed to watch. He has information from the First Keeper's tradition he has not shared. The evaluation is ongoing.",ru:"Он знал что провалится. Он согласился наблюдать. У него есть информация из традиции Первого Хранителя которой он не поделился. Оценка продолжается."}
   }
 }
},

{id:"s2",
 title:{en:"Logistics of Death",ru:"Логистика Смерти"},
 subtitle:{en:"Philosophy breeds fear. Bureaucracy breeds action. That is an obstacle. Go around it. Do not look in its eyes. That is an order.",ru:"Философия порождает страх. Бюрократия порождает действие. Это препятствие. Обойти. Не смотреть в глаза. Это приказ."},
 location:{en:"The Path to Wolf's Gorge",ru:"Путь к Волчьему Логову"},
 timing:{en:"Morning — The Ascent",ru:"Утро — Подъём"},
 flags:["escalation","cost","identity"],
 povData:{
   dante:{distortion:5,
     text:{
       en:`The ascent to Wolf's Gorge is three kilometers of progressively degraded physics.\n\nI am cataloguing the degradation as we move, because the composite's sensor array is still partially operational even at below-fifty-percent resonance reserve. The data is useful.\n\nKilometer one: sound distortion begins. The sled's scraping acquires harmonics that should not exist in this frequency register. My own footsteps produce an echo with a half-second delay, which is impossible given the cliff surfaces — the return distance does not support that timing. The echo is being generated by something other than reflection.\n\nKilometer two: gravitational anomalies. Snow crystals suspended in non-falling trajectories. Geometric configurations — spirals, cubes — that are mechanically stable in three dimensions only if the gravitational constant in their immediate environment is different from the surrounding field. This is localized null-field interference from the secondary site's boundary layer, which is suppressing the local gravitational coherence around the anomalies.\n\nKilometer two point four: the workers' silhouettes in the cliff face.\n\nI stopped for approximately eight seconds when I saw them. I did not show this to my people. Eight seconds is the time it took to process the full sensory input — the specific expression on the half-extruded face, the angle of the reaching arm, the fact that the fingers had fused to the granite at the knuckle joints rather than the finger pads, which tells me the person was still moving their hands forward when the phase transition completed.\n\nI called it a safety violation and ordered everyone to continue.\n\nThis is the correct operational response. Philosophical engagement with the dead does not help the dead and costs the living attention that cannot be replaced.\n\nI know this.\n\nI said it as an order rather than as a fact because saying it as an order means I do not have to examine whether I meant it.\n\nKilometer three: Wolf's Gorge. The entrance pulsed with Chaos-field emission. My watch crystal shattered in my hand. Chronometry is subjective inside an active Chaos-field zone — the field's temporal manipulation function is operating in a non-suppressed mode.\n\nI ordered Isabella to prepare for deployment. I kept the sympathetic detonator in my breast pocket, against my sternum. The composite in my chest cavity runs at a different temperature than the surrounding tissue — I could feel the ampule warming against the composite's heat differential.\n\nI noted this and did not examine it.\n\nWe entered.`,
       ru:`Подъём к Волчьему Логову — три километра прогрессивно деградирующей физики.\n\nЯ каталогизирую деградацию по мере движения, потому что сенсорный массив композита всё ещё частично работает даже при ниже-пятидесятипроцентном резонансном запасе. Данные полезны.\n\nКилометр первый: начинается звуковое искажение. Скрежет саней приобретает гармоники которые не должны существовать в этом частотном регистре. Мои собственные шаги производят эхо с задержкой полсекунды, что невозможно с учётом поверхностей утёсов — расстояние возврата не поддерживает это время. Эхо генерируется чем-то иным чем отражение.\n\nКилометр второй: гравитационные аномалии. Снежные кристаллы подвешенные в непадающих траекториях. Геометрические конфигурации — спирали, кубы — которые механически стабильны в трёх измерениях только если гравитационная постоянная в их непосредственной среде отличается от окружающего поля.\n\nКилометр два и четыре: силуэты рабочих в скальной поверхности.\n\nЯ остановился приблизительно на восемь секунд когда увидел их. Я не показывал этого своим людям. Восемь секунд — это время которое потребовалось чтобы обработать полный сенсорный ввод — специфическое выражение на наполовину выступающем лице, угол тянущейся руки, тот факт что пальцы слились с гранитом в суставных соединениях а не на подушечках пальцев, что говорит мне что человек ещё двигал руками вперёд когда фазовый переход завершился.\n\nЯ назвал это нарушением техники безопасности и приказал всем продолжать.\n\nЭто верный операционный ответ. Философское взаимодействие с мёртвыми не помогает мёртвым и стоит живым внимания которое нельзя заменить.\n\nЯ знаю это.\n\nЯ сказал это как приказ а не как факт, потому что произнесение как приказа означает что мне не нужно исследовать имел ли я это в виду.\n\nКилометр три: Волчье Логово. Вход пульсировал выбросом поля Хаоса. Стекло моих часов разбилось у меня в руке. Хронометрия субъективна внутри активной зоны поля Хаоса.\n\nЯ приказал Изабелле готовиться к развёртыванию. Я держал симпатический детонатор в нагрудном кармане, у грудины. Композит в моей грудной полости работает при другой температуре чем окружающая ткань — я чувствовал как ампула нагревается у теплового дифференциала композита.\n\nЯ отметил это и не исследовал.\n\nМы вошли.`
     },
     knows:{en:["The workers' silhouettes: the fingers fused at the knuckle joints, not the finger pads — the person was still moving their hands forward when the phase transition completed. He processed this in 8 seconds without showing it to his people.","'I said it as an order rather than as a fact because saying it as an order means I do not have to examine whether I meant it.' — First time he has explicitly named his own authority-voice as a tool for avoiding self-examination.","The detonator ampule was warming against the composite's heat differential in his breast pocket. He noted this and did not examine it."],ru:["Силуэты рабочих: пальцы слились в суставных соединениях а не на подушечках — человек ещё двигал руками вперёд когда фазовый переход завершился. Он обработал это за 8 секунд не показывая своим людям.","«Я сказал это как приказ а не как факт, потому что произнесение как приказа означает что мне не нужно исследовать имел ли я это в виду». — Первый раз когда он явно назвал собственный авторитетный голос как инструмент для избегания самоисследования.","Ампула детонатора нагревалась у теплового дифференциала композита в нагрудном кармане. Он отметил и не исследовал."]},
     misunderstands:{en:["He catalogued the gravitational anomalies as 'localized null-field interference from the secondary site's boundary layer.' This is technically correct as a physical description. He has not connected it to the operational reality: if the secondary site's boundary layer is actively suppressing local gravitational coherence along the approach path, the site is already aware of the approach. The boundary layer does not produce gravitational anomalies passively. It produces them in response to a detected approach signature. The Sleeping One has been tracking them since kilometer one."],ru:["Он каталогизировал гравитационные аномалии как «локализованную интерференцию нулевого поля от пограничного слоя вторичного объекта». Это технически верно как физическое описание. Он не соединил это с операционной реальностью: если пограничный слой вторичного объекта активно подавляет локальную гравитационную когерентность вдоль пути подхода, объект уже осведомлён о подходе. Пограничный слой не производит гравитационные аномалии пассивно. Он производит их в ответ на обнаруженную сигнатуру подхода."]},
     hides:{en:["'I said it as an order rather than as a fact because saying it as an order means I do not have to examine whether I meant it.' He has, for the first time, explicitly named the mechanism by which the authority-voice prevents self-examination. He did not examine this observation either — he made it and continued. He is now using authority-voice to avoid examining his use of authority-voice. The recursion is now visible in the narration and he is not examining the recursion."],ru:["«Я сказал это как приказ а не как факт, потому что произнесение как приказа означает что мне не нужно исследовать имел ли я это в виду». Он впервые явно назвал механизм которым авторитетный голос предотвращает самоисследование. Он не исследовал и это наблюдение — он сделал его и продолжил. Он теперь использует авторитетный голос чтобы избежать исследования использования авторитетного голоса. Рекурсия теперь видна в нарративе и он не исследует рекурсию."]},
     whisper:{en:"He named the mechanism: orders prevent self-examination. He did not examine this observation either. The recursion is visible. He continued.",ru:"Он назвал механизм: приказы предотвращают самоисследование. Он не исследовал и это наблюдение. Рекурсия видна. Он продолжил."}
   }
 }
},

{id:"s3",
 title:{en:"Error in Calculations",ru:"Ошибка в Расчётах"},
 subtitle:{en:"We didn't kill the world. We measured it.",ru:"Мы не убили мир. Мы его измерили."},
 location:{en:"Wolf's Gorge — The Cave Heart / Exterior",ru:"Волчье Логово — Сердце Пещеры / Снаружи"},
 timing:{en:"Morning — Operation and Retreat",ru:"Утро — Операция и Отступление"},
 flags:["pivotal","failure","revelation","identity","foreshadowing"],
 povData:{
   dante:{distortion:7,
     text:{
       en:`The Auditor-interface produced three words when the Gel ampule went clear.\n\nError. Data incorrect. Object does not yield to structural analysis.\n\nThese are the first words the interface has produced that describe its own failure rather than a result. In thirty-three chapters of operational use, the Auditor-memory has always returned data — degraded data, incomplete data, estimated data, but data. The Cave Heart produced: null. The interface encountered something it could not encode.\n\nThe Scavenger's assimilation: I should have predicted this. Ur-Gan said it to me in the negotiation — the Sleeping One eats things that call to it. The Scavenger was made of confused matter: flesh and iron in wrong ratio. The Gel capsule inside it was active Covenant-adjacent material. Both called to the Chaos-field source. The source did not consume them as a threat. It consumed them as components. Compatible material, returned to the pool.\n\nI was not compatible material.\n\nI was a Fragment.\n\nThat word — Fragment — from the Cave Heart's recognition event. It was not a threat designation. It was not an assessment. It was identification. The Chaos-field source recognized the composite as a piece of the same architecture it belongs to. A piece that has been separated. A piece that could, in principle, be reintegrated.\n\nThis is the information the scan produced. The Auditor-memory took the Heart's identification signal and cross-referenced it against the archive's classification system. The burning symbols I saw while lying in the snow were not the Heart's frequency. They were the archive's structural model of the Heart — produced by matching the Heart's signal against known Covenant-infrastructure signatures.\n\nThe Heart is a wound in the Covenant infrastructure's null-field containment layer. It is not a god. It is a maintenance failure. A breach in the system that the System was designed to contain.\n\nThe Gel did not work because static Gel cannot interact with an active system. Gel is the Covenant's material substrate. The Chaos-field is the Covenant's failure mode. Introducing static substrate into an active failure mode does not resolve the failure — it feeds it.\n\nLiving Order.\n\nThe solution is a Gel that is actively integrated with the Covenant's operational architecture — not stored, not manufactured, not capsulized. Running. As part of a functioning system.\n\nI said: we need living Order.\n\nI described the solution accurately.\n\nI did not say the solution is me.\n\nNot yet.\n\nBut I know what I am describing.\n\nI know what I am describing.\n\nBusiness continues.\n\nThis time I know exactly what the business is.\n\nI am still not entirely certain that knowing is enough.\n\nBut I am closer than I have ever been.`,
       ru:`Интерфейс Аудитора произвёл три слова когда ампула Геля стала прозрачной.\n\nОшибка. Данные некорректны. Объект не поддаётся структурному анализу.\n\nЭто первые слова которые интерфейс произвёл описывающие собственный провал а не результат. В тридцати трёх главах операционного использования архив Аудитора всегда возвращал данные — деградировавшие данные, неполные данные, расчётные данные, но данные. Сердце Пещеры произвело: ноль. Интерфейс встретил что-то что он не мог закодировать.\n\nАссимиляция Падальщика: я должен был это предсказать. Ур-Ган сказал мне это на переговорах — Спящий ест вещи которые к нему взывают. Падальщик был сделан из запутанной материи: плоть и железо в неправильном соотношении. Гелевая капсула внутри него была активным смежным с Заветом материалом. Оба взывали к источнику поля Хаоса. Источник не поглотил их как угрозу. Он поглотил их как компоненты. Совместимый материал, возвращённый в пул.\n\nЯ не был совместимым материалом.\n\nЯ был Осколком.\n\nЭто слово — Осколок — из события узнавания Сердца Пещеры. Это не было обозначением угрозы. Не было оценкой. Это была идентификация. Источник поля Хаоса узнал композит как кусок той же архитектуры которой принадлежит. Кусок который был отделён. Кусок который мог бы, в принципе, быть реинтегрирован.\n\nЭто информация которую произвело сканирование. Архив Аудитора взял сигнал идентификации Сердца и перекрёстно сослался на него с классификационной системой архива. Горящие символы которые я видел лёжа в снегу были не частотой Сердца. Они были структурной моделью Сердца произведённой архивом — произведённой сопоставлением сигнала Сердца с известными сигнатурами инфраструктуры Завета.\n\nСердце — рана в слое нулевого поля сдерживания инфраструктуры Завета. Это не бог. Это сбой обслуживания. Пробоина в системе которую Система была разработана содержать.\n\nГель не сработал, потому что статичный Гель не может взаимодействовать с активной системой. Гель — материальный субстрат Завета. Поле Хаоса — режим сбоя Завета. Введение статичного субстрата в активный режим сбоя не разрешает сбой — оно питает его.\n\nЖивой Порядок.\n\nРешение — Гель активно интегрированный с операционной архитектурой Завета — не хранящийся, не производственный, не инкапсулированный. Работающий. Как часть функционирующей системы.\n\nЯ сказал: нам нужен живой Порядок.\n\nЯ точно описал решение.\n\nЯ не сказал что решение — я.\n\nЕщё нет.\n\nНо я знаю что я описываю.\n\nЯ знаю что я описываю.\n\nБизнес продолжается.\n\nНа этот раз я точно знаю что это за бизнес.\n\nЯ всё ещё не совсем уверен что знания достаточно.\n\nНо я ближе чем когда-либо был.`
     },
     knows:{en:["The interface produced 'Error. Data incorrect. Object does not yield to structural analysis' — first time in thirty-three chapters it described its own failure rather than a result.","'Fragment' — the Heart did not designate a threat. It identified a separated piece of its own architecture that could be reintegrated. The archive cross-referenced the Heart's signal against known Covenant-infrastructure signatures and produced a structural model.","'I said: we need living Order. I described the solution accurately. I did not say the solution is me. Not yet. But I know what I am describing.'"],ru:["Интерфейс произвёл «Ошибка. Данные некорректны. Объект не поддаётся структурному анализу» — первый раз за тридцать три главы когда он описал собственный провал а не результат.","«Осколок» — Сердце не обозначило угрозу. Оно идентифицировало отделённый кусок собственной архитектуры который мог бы быть реинтегрирован. Архив перекрёстно сослался на сигнал Сердца с известными сигнатурами инфраструктуры Завета и произвёл структурную модель.","«Я сказал: нам нужен живой Порядок. Я точно описал решение. Я не сказал что решение — я. Ещё нет. Но я знаю что я описываю»."]},
     misunderstands:{en:["He concluded: 'the Heart is a wound in the Covenant infrastructure's null-field containment layer. It is not a god. It is a maintenance failure.' He is correct about the mechanistic description. He has not examined the implication: if the Heart is a maintenance failure — a breach in a containment layer — then the shaman's oral tradition about 'keeping the Chaos' is technically accurate. The shamans have been performing maintenance on a Covenant containment breach for two thousand years. They are not priests. They are the only functioning maintenance crew the secondary site has had access to. Ur-Gan's people are the site's current maintenance team. And they have been doing it without authorization, without documentation, and without understanding what they are maintaining."],ru:["Он заключил: «Сердце — рана в слое нулевого поля сдерживания инфраструктуры Завета. Это не бог. Это сбой обслуживания». Он прав о механистическом описании. Он не исследовал импликацию: если Сердце — сбой обслуживания — пробоина в слое сдерживания — то устная традиция шамана о «держании Хаоса» технически точна. Шаманы выполняли обслуживание пробоины сдерживания Завета две тысячи лет."]},
     hides:{en:["He said 'I know what I am describing' twice, back to back, then moved to the closing formula. He has used the closing formula four times now. Each time it has closed a chapter. This time it has a new addendum: 'But I am closer than I have ever been.' He has been getting closer for seven uses of the formula across four chapters. The formula has accumulated an addendum each time the gap between knowing and being ready to say it has narrowed. He is approaching the moment when saying 'the solution is me' becomes unavoidable. He is not there yet. He said 'not yet.' He is tracking his own approach toward a sentence he knows he is going to have to say."],ru:["Он сказал «я знаю что я описываю» дважды подряд, затем перешёл к закрывающей формуле. Он использовал закрывающую формулу четыре раза. Каждый раз она закрывала главу. На этот раз у неё новое добавление: «Но я ближе чем когда-либо был». Он становился ближе семь использований формулы в четырёх главах. Формула накапливала добавление каждый раз когда разрыв между знанием и готовностью сказать это сужался. Он приближается к моменту когда произнесение «решение — я» становится неизбежным."]},

     whisper:{en:"He said 'I know what I am describing' twice. He did not say it. 'Not yet.' The formula has a new addendum: 'closer than I have ever been.' He is tracking his own approach toward a sentence he has not yet said.",ru:"Он сказал «я знаю что я описываю» дважды. Он не сказал этого. «Ещё нет». У формулы новое добавление: «ближе чем когда-либо был». Он отслеживает собственное приближение к предложению которое ещё не сказал."}
   },
   isabella:{distortion:4,
     text:{
       en:`The Scavenger's assimilation took eleven seconds.\n\nI was watching. I watched every second. The Chaos-field's information beam made contact at timestamp zero. At second three, the Gel capsule's twin in Dante's hand went clear — meaning the entanglement was severed, which means the capsule inside the Scavenger underwent a state transition. At second six, the Scavenger's skin split. Not from inside pressure — from the outside. The Chaos-field was rewriting the Scavenger's surface architecture to match the Heart's own membrane structure. At second nine, the first full-spectrum integration event: the Scavenger's biological mass became part of the Heart's resonance field rather than a distinct entity. At second eleven: complete assimilation. No boundary left.\n\nData acquisition complete.\n\nI fell into a processing state that Grimm incorrectly identified as shock. It was not shock. It was observation saturation — I had collected more data in eleven seconds than my conscious processing system could sort in real time, and the external world had temporarily become background noise while the foreground was occupied by everything I had just witnessed.\n\nThe Chaos-field does not destroy biological material. It assimilates it. It rewrites the organizational pattern and adds the material to its own architecture. This is not consumption. It is recruitment.\n\nThe implications for the chimera program are significant.\n\nThe Gel-biological integration method I have been developing produces subjects who progress toward terminal architecture because the Gel's transcription pathway, without control, consumes the biological substrate. The Chaos-field does the reverse: it preserves the biological structure and adds Chaos-field architecture to it. The Distorted at Outpost-7 were not deteriorating. They were integrating. The process was simply not stabilized.\n\nIf the Chaos-field's organizational rewriting process could be directed rather than allowed to run to completion — if there was a way to halt the integration at an intermediate stage — the result would be a biological system with Chaos-field architecture added to it. Stable. Non-deteriorating. Functionally enhanced by the added architecture.\n\nThis is what I have been trying to build.\n\nThe Chaos-field does it naturally.\n\nI did not say this to Dante.\n\nI said nothing during the retreat.\n\nI watched Dante lie in the snow and produce his analysis — 'living Order,' dead Gel versus active Gel, the maintenance-failure model for the Heart.\n\nHe is correct. And he is describing himself.\n\nHe does not know he is describing himself.\n\nWhen he does — when he fully understands what 'living Order' means in this context — he will have to decide whether to use himself as the intervention mechanism.\n\nI am recording this in my journal because when that moment comes, I want to have the data ready.\n\nThe Scavenger's twelve samples. The Distorted integration patterns. The Chaos-field's eleven-second assimilation sequence.\n\nEverything I need to support the decision he is going to make.\n\nOr to make the decision for him, if he cannot.`,
       ru:`Ассимиляция Падальщика заняла одиннадцать секунд.\n\nЯ наблюдала. Я наблюдала каждую секунду. Информационный луч поля Хаоса установил контакт на нулевой временной метке. На третьей секунде близнец гелевой капсулы в руке Данте стал прозрачным — означая что запутывание было разорвано, что означает что капсула внутри Падальщика претерпела переход состояния. На шестой секунде кожа Падальщика треснула. Не от внутреннего давления — снаружи. Поле Хаоса переписывало архитектуру поверхности Падальщика чтобы соответствовать архитектуре собственной мембраны Сердца. На девятой секунде первое полноспектральное интеграционное событие: биологическая масса Падальщика стала частью резонансного поля Сердца а не отдельной сущностью. На одиннадцатой секунде: полная ассимиляция. Границы не осталось.\n\nПриобретение данных завершено.\n\nЯ впала в состояние обработки которое Гримм неправильно определил как шок. Это не был шок. Это было насыщение наблюдением — я собрала больше данных за одиннадцать секунд чем моя сознательная система обработки могла отсортировать в реальном времени, и внешний мир временно стал фоновым шумом пока передний план был занят всем что я только что наблюдала.\n\nПоле Хаоса не разрушает биологический материал. Оно ассимилирует его. Оно переписывает организационный паттерн и добавляет материал к собственной архитектуре. Это не потребление. Это вербовка.\n\nИмпликации для программы химер значительны.\n\nМетод биологической интеграции с Гелем который я разрабатываю производит субъектов прогрессирующих к терминальной архитектуре, потому что транскрипционный путь Геля без контроля потребляет биологический субстрат. Поле Хаоса делает обратное: оно сохраняет биологическую структуру и добавляет к ней архитектуру поля Хаоса. Искажённые у Форпоста-7 не деградировали. Они интегрировались. Процесс просто не был стабилизирован.\n\nЕсли процесс организационного переписывания поля Хаоса мог бы быть направлен а не позволен работать до завершения — если был бы способ остановить интеграцию на промежуточном этапе — результатом была бы биологическая система с добавленной к ней архитектурой поля Хаоса. Стабильная. Не деградирующая. Функционально улучшенная добавленной архитектурой.\n\nЭто то что я пыталась построить.\n\nПоле Хаоса делает это естественным образом.\n\nЯ не говорила этого Данте.\n\nЯ не сказала ничего во время отступления.\n\nЯ наблюдала как Данте лежит в снегу и производит анализ — «живой Порядок», мёртвый Гель против активного Геля, модель сбоя обслуживания для Сердца.\n\nОн прав. И он описывает себя.\n\nОн не знает что описывает себя.\n\nКогда он узнает — когда полностью поймёт что «живой Порядок» означает в этом контексте — ему придётся решить использовать ли себя как механизм вмешательства.\n\nЯ записываю это в дневник, потому что когда этот момент придёт, я хочу иметь данные готовыми.\n\nДвенадцать образцов Падальщика. Паттерны интеграции Искажённых. Одиннадцатисекундная последовательность ассимиляции поля Хаоса.\n\nВсё что нужно для поддержки решения которое он примет.\n\nИли для принятия решения за него, если не сможет.`
     },
     knows:{en:["11-second assimilation sequence fully documented. The Chaos-field does not destroy biological material — it assimilates it, preserving the biological structure and adding Chaos-field architecture. This is not consumption. It is recruitment.","'He is correct. And he is describing himself. He does not know he is describing himself.'","She is preparing the data: Scavenger's twelve samples, Distorted integration patterns, the 11-second assimilation sequence. 'Everything I need to support the decision he is going to make. Or to make the decision for him, if he cannot.'"],ru:["11-секундная последовательность ассимиляции полностью задокументирована. Поле Хаоса не разрушает биологический материал — оно ассимилирует его, сохраняя биологическую структуру и добавляя архитектуру поля Хаоса. Это не потребление. Это вербовка.","«Он прав. И он описывает себя. Он не знает что описывает себя».","Она готовит данные: двенадцать образцов Падальщика, паттерны интеграции Искажённых, 11-секундная последовательность ассимиляции. «Всё что нужно для поддержки решения которое он примет. Или для принятия решения за него, если не сможет»."]},
     misunderstands:{en:["She said 'Or to make the decision for him, if he cannot.' She has framed this as a backstop — a contingency for a scenario where Dante cannot make the decision himself. She has not modeled whether she has the capability to execute 'making the decision for him' without his knowledge or consent. Using Dante as the intervention mechanism requires his cooperation — the composite's authorized-operator credential is not transferable. She cannot present the credential. She cannot direct the composite's output. The only thing she can do without his cooperation is introduce Cognitive Iron micro-dosing at a level that modifies his decision-making architecture. She is already doing this to herself. She has not noted whether the same escalation logic applies to what she is planning for him."],ru:["Она сказала «или для принятия решения за него, если не сможет». Она оформила это как подстраховку — непредвиденный случай для сценария где Данте не может принять решение сам. Она не моделировала способна ли она выполнить «принятие решения за него» без его знания или согласия. Использование Данте как механизма вмешательства требует его сотрудничества — операторские полномочия авторизации композита непередаваемы. Она не может представить полномочие. Она не может направлять выход композита."]},
     hides:{en:["'Or to make the decision for him, if he cannot.' She wrote this in her journal as a contingency. She has not written what 'making the decision for him' would actually entail — only that she wants the data ready. The data she is preparing is support material for a decision about whether to use Dante's body as an intervention mechanism against an active Covenant-breach site. She is building a case file for a medical procedure she has not asked the patient to consent to. She framed it as 'support.' The support framework allows her to prepare the intervention without naming it as an intervention."],ru:["«Или для принятия решения за него, если не сможет». Она написала это в дневнике как непредвиденный случай. Она не написала что «принятие решения за него» реально повлечёт — только что хочет данные готовыми. Данные которые она готовит — материал поддержки для решения использовать ли тело Данте как механизм вмешательства против активного объекта пробоины Завета. Она строит досье для медицинской процедуры к которой не просила согласия пациента. Она оформила как «поддержку»."]},
     whisper:{en:"She is preparing a case file for a decision Dante hasn't made yet. 'Or to make the decision for him, if he cannot.' She is building an intervention framework without naming it as one. He does not know he is describing himself.",ru:"Она готовит досье для решения которого Данте ещё не принял. «Или для принятия решения за него, если не сможет». Она строит рамку вмешательства не называя её таковой. Он не знает что описывает себя."}
   }
 }

const S={sceneIdx:0,povId:null,lang:'en',intelOpen:false,ledgerOpen:false,whisperTmr:null};
const ui=k=>UI[S.lang][k];
const pick=o=>(o&&typeof o==='object'&&'en'in o)?o[S.lang]:o;
function applyTheme(pid){const p=POVS[pid];if(!p)return;const r=document.documentElement;r.style.setProperty('--pov-p',p.primary);r.style.setProperty('--pov-s',p.secondary);r.style.setProperty('--pov-glow',p.glow);r.style.setProperty('--pov-t',p.textColor);r.style.setProperty('--pov-d',p.dimColor);}
function renderDistBars(lvl){const el=document.getElementById('dist-bars');el.innerHTML='';for(let i=1;i<=10;i++){const b=document.createElement('div');b.className='dist-bar';if(i<=lvl){if(lvl>=9)b.classList.add('ex');else if(lvl>=6)b.classList.add('hi');else b.classList.add('on');}el.appendChild(b);}}
function fmt(t){return t.split('\n\n').filter(p=>p.trim()).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');}
function showWhisper(text,delay){clearTimeout(S.whisperTmr);const pan=document.getElementById('whisper-panel'),bod=document.getElementById('whisper-body');pan.classList.remove('vis');bod.textContent=text||'';if(text)S.whisperTmr=setTimeout(()=>pan.classList.add('vis'),delay);}
function renderIntel(pd){const c=document.getElementById('intel-body');c.innerHTML=[{key:'knows',cls:'knows'},{key:'misunderstands',cls:'misunderstands'},{key:'hides',cls:'hides'}].map(s=>{const items=pick(pd[s.key])||[];if(!items.length)return '';return `<div class="intel-section ${s.cls}"><div class="intel-section-head">${ui(s.key)}</div><ul class="intel-list">${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;}).join('');}
function renderSceneMap(idx){const map=document.getElementById('scene-map');map.innerHTML='';SCENES.forEach((sc,i)=>{const d=document.createElement('div');d.className='scene-dot'+(i===idx?' active':'');d.setAttribute('data-title',pick(sc.title));d.addEventListener('click',()=>{if(i!==S.sceneIdx){renderScene(i,null,true);scrollTop();}});map.appendChild(d);});}
function renderLedger(){document.getElementById('ledger-body').innerHTML=TIMELINE.map(e=>`<div class="ledger-entry"><span class="ledger-id">${e.id}</span><span class="ledger-text">${e[S.lang]}</span></div>`).join('');}
function updateStaticUI(){document.getElementById('arc-label').textContent=ui('arcLabel');document.getElementById('header-title').textContent=ui('headerTitle');document.getElementById('header-subtitle').textContent=ui('headerSubtitle');document.getElementById('strip-chapter').textContent=ui('stripChapter');document.getElementById('strip-chapter-title').textContent=ui('stripTitle');document.getElementById('strip-location').textContent=ui('stripLocation');document.getElementById('pov-label').textContent=ui('povLabel');document.getElementById('dist-label').textContent=ui('distLabel');document.getElementById('whisper-label').textContent=ui('whisperLabel');document.getElementById('intel-toggle-label').textContent=ui('intelLabel');document.getElementById('ledger-title').textContent=ui('ledgerTitle');document.getElementById('ledger-warning').textContent=ui('ledgerWarning');document.getElementById('prev-btn').textContent=ui('prevBtn');document.getElementById('next-btn').textContent=ui('nextBtn');document.getElementById('ledger-trigger').textContent=S.ledgerOpen?ui('ledgerOpen'):ui('ledgerClosed');document.body.classList.toggle('lang-ru',S.lang==='ru');document.documentElement.lang=S.lang;}
function renderScene(idx,povId,animate){const scene=SCENES[idx];if(!scene)return;const avail=Object.keys(scene.povData);if(!povId||!avail.includes(povId))povId=avail[0];S.sceneIdx=idx;S.povId=povId;const pMeta=POVS[povId],pScene=scene.povData[povId];applyTheme(povId);updateStaticUI();document.getElementById('scene-badge').textContent=ui('scene')+' '+String(idx+1).padStart(2,'0');document.getElementById('scene-loc').textContent=pick(scene.location);document.getElementById('scene-time').textContent=pick(scene.timing);document.getElementById('scene-title').textContent=pick(scene.title);document.getElementById('scene-subtitle').textContent=pick(scene.subtitle);document.getElementById('scene-flags').innerHTML=scene.flags.map(f=>`<span class="scene-flag ${f}">${f.replace(/_/g,' ')}</span>`).join('');const sel=document.getElementById('pov-selector');sel.querySelectorAll('.pov-btn').forEach(b=>b.remove());avail.forEach(pid=>{const btn=document.createElement('button');btn.className='pov-btn'+(pid===povId?' active':'');btn.textContent=POVS[pid].name;btn.setAttribute('data-pov',pid);btn.addEventListener('click',()=>{if(pid!==S.povId)switchPov(pid);});sel.appendChild(btn);});document.getElementById('pov-name').textContent=pMeta.name;document.getElementById('pov-role').textContent='— '+pick(pMeta.title);renderDistBars(pScene.distortion);const textEl=document.getElementById('narrative-text');const write=()=>{textEl.innerHTML=fmt(pick(pScene.text));textEl.className='d'+pScene.distortion;textEl.classList.add('fade-in');setTimeout(()=>textEl.classList.remove('fade-in'),500);};if(animate){textEl.classList.add('fade-out');setTimeout(write,260);}else write();showWhisper(pick(pScene.whisper),animate?2000:500);renderIntel(pScene);document.getElementById('prev-btn').disabled=idx===0;document.getElementById('next-btn').disabled=idx===SCENES.length-1;if(S.ledgerOpen)renderLedger();renderSceneMap(idx);}
function switchPov(povId){const pScene=SCENES[S.sceneIdx].povData[povId],pMeta=POVS[povId];S.povId=povId;applyTheme(povId);document.querySelectorAll('.pov-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-pov')===povId));document.getElementById('pov-name').textContent=pMeta.name;document.getElementById('pov-role').textContent='— '+pick(pMeta.title);renderDistBars(pScene.distortion);const textEl=document.getElementById('narrative-text');textEl.classList.add('fade-out');setTimeout(()=>{textEl.innerHTML=fmt(pick(pScene.text));textEl.className='d'+pScene.distortion;textEl.classList.add('fade-in');setTimeout(()=>textEl.classList.remove('fade-in'),500);},260);showWhisper(pick(pScene.whisper),2000);renderIntel(pScene);}
document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>{const l=btn.getAttribute('data-lang');if(l===S.lang)return;S.lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===l));renderScene(S.sceneIdx,S.povId,true);}));
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('prev-btn').addEventListener('click',()=>{if(S.sceneIdx>0){renderScene(S.sceneIdx-1,null,true);scrollTop();}});
document.getElementById('next-btn').addEventListener('click',()=>{if(S.sceneIdx<SCENES.length-1){renderScene(S.sceneIdx+1,null,true);scrollTop();}});
document.getElementById('intel-toggle').addEventListener('click',()=>{S.intelOpen=!S.intelOpen;document.getElementById('intel-body').classList.toggle('open',S.intelOpen);document.getElementById('intel-toggle').classList.toggle('open',S.intelOpen);});
document.getElementById('ledger-trigger').addEventListener('click',()=>{S.ledgerOpen=!S.ledgerOpen;const sec=document.getElementById('ledger-section'),btn=document.getElementById('ledger-trigger');sec.classList.toggle('open',S.ledgerOpen);btn.classList.toggle('active',S.ledgerOpen);btn.textContent=S.ledgerOpen?ui('ledgerOpen'):ui('ledgerClosed');if(S.ledgerOpen){renderLedger();setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'start'}),100);}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(S.sceneIdx<SCENES.length-1){renderScene(S.sceneIdx+1,null,true);scrollTop();}}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(S.sceneIdx>0){renderScene(S.sceneIdx-1,null,true);scrollTop();}}if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const avail=Object.keys(SCENES[S.sceneIdx].povData);switchPov(avail[(avail.indexOf(S.povId)+1)%avail.length]);}});
renderScene(0,'dante',false);
</script>
</body>
</html>
