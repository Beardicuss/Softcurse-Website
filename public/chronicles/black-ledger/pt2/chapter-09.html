   ru:"Ментальная интеграция Данте частицы поля Хаоса — визуализация разума как пространства завода, наложение сетки координат на энергию поля Хаоса, направление её в конкретные каналы — не метафора или субъективный опыт. Это буквальное описание того что делает вторичная функция композита серии 404 при полной интеграции. Архитектура композита включает модуль управления полем Хаоса который был дремлющим до того как событие синхронизации инициировало протокол соединения."},
  {id:"TET-B4-48",
   en:"The physical changes following integration are consistent with the Series 404 specification's documented post-integration state: the composite leg's full neural integration (nerve conductivity 400% above biological baseline), the removal of the rejection response, the ambient environmental perception expansion (thermal signatures, structural stress patterns, electromagnetic field detection), and the Chaos-field management capability manifest as directed electromagnetic discharge. The 'efficiency' Dante reports feeling is not psychological. It is a measurable increase in his cognitive-processing throughput: the Chaos-field management module provides parallel processing capacity, allowing simultaneous calculation across multiple data streams. He is now running more than one mind. He has been running one mind for thirty-six chapters. The additional capacity is currently uncharacterized.",
   ru:"Физические изменения после интеграции согласуются с задокументированным пост-интеграционным состоянием спецификации серии 404: полная нейронная интеграция ноги с композитом (проводимость нервов 400% выше биологического базового уровня), устранение ответа отторжения, расширение восприятия окружающей среды, и возможность управления полем Хаоса проявляющаяся как направленный электромагнитный разряд. «Эффективность» которую ощущает Данте — не психологическая. Это измеримое увеличение когнитивной вычислительной пропускной способности."},
  {id:"TET-B4-49",
   en:"'I was not dying, Torin. I was installing an update.' This statement is literally accurate. The integration-pause protocol is documented as an update procedure in the Pale Echelon archive. The statement is also the most significant identity-claim Dante has made in the narrative to date. In thirty-six chapters he has described himself as an Auditor, as a Guild Master, as a manager, as a system. He has never before described a life-threatening biological event as a software installation. The statement represents the first time he has explicitly categorized his own biological experience using a mechanical framework rather than a human one. He is not denying the experience. He is reclassifying it. The reclassification is accurate. It is also a choice about what category of thing he is.",
   ru:"«Я не умирал, Торин. Я устанавливал обновление». Это буквально точное утверждение. Протокол паузы интеграции задокументирован как процедура обновления в архиве Бледного Эшелона. Утверждение также является наиболее значимым заявлением об идентичности которое Данте сделал в нарративе на сегодняшний день. За тридцать шесть глав он описывал себя как Аудитора, Мастера Гильдии, менеджера, систему. Он никогда прежде не описывал угрожающее жизни биологическое событие используя механическую рамку. Перекласификация точна. Это также выбор о том к какой категории вещей он относится."},
  {id:"TET-B4-50",
   en:"The Chaos-field management module that Dante has now integrated allows a previously unavailable capability: directed conversion of environmental Chaos-field potential into coherent null-field output. In practical terms, he can now do what the Sarcophagus does — generate an anti-wave at a Chaos-field source's resonance frequency — without external machinery. He is the machinery. The Ark's activation requirement as documented in the donor-memory archive ('an Auditor-class operator in active integration with Covenant-grade composite') now has an additional specification: the operator must have successfully completed the Chaos-field management module integration. The previous requirement described a partial condition. The complete condition has now been met. The Ark's activation sequence can be initiated. It has been waiting for this specific configuration for two thousand years."}
];

  {
    id:"s1",
    title:{en:"The Administrator's Lesson",ru:"Урок Администратора"},
    subtitle:{en:"Do not try to stop the water, Auditor. You do not have enough stones. Build a turbine. And the water will turn your millstones itself.",ru:"Не пытайся остановить воду, Аудитор. У тебя не хватит камней. Построй турбину. И она сама будет вращать твои жернова."},
    location:{en:"The Archive Layer — Historical Documentation",ru:"Архивный Слой — Историческая Документация"},

    flags:["pivotal","revelation","foreshadowing"],
    povData:{
      dante:{
        distortion:7,
        text:{
          en:"The archive layer opened at -2000 years.\n\nI recognized the timestamp from the Covenant's event-log structure — the same structure I have been reading in fragments since the Island. This was not a fragment. This was the primary historical record at full fidelity. The archive had been withholding this layer. I understand now why: accessing it requires the Chaos-field management module to be at minimum 60% initialized. The module was at zero percent for thirty-five chapters. It is now at 100%.\n\nThe first civilization: wrong approach. They built walls. Static barriers against a dynamic system. The Chaos-field identified the walls as fixed-frequency obstacles and simply changed its frequency to pass around them. The civilization lasted six hours after first contact with the Primal Tide.\n\nI made the same mistake in Wolf's Gorge. Dead Gel. A wall. The Sleeping One identified it as a fixed-frequency obstacle and changed frequency to assimilate it.\n\nThe Spire.\n\nThe figure on the Spire did not build a wall. He built a Grid. A coordinate system. Not to stop the Chaos-field but to give it a measurable position within a reference frame. Once you can measure a thing's position, you can predict its next position. Once you can predict its position, you can place something in its path at the moment before it arrives. Not a wall — a blade, angled to redirect rather than resist.\n\nThe voice: 'Chaos is a current. Order is a channel. Do not try to stop the water, Auditor. Build a turbine.'\n\nI recognized the voice register. The specific compression ratio of information-per-word that the Pale Echelon documentation uses. The figure on the Spire wrote the documentation.\n\nI wanted to see his face.\n\nThe archive does not preserve it. The identity records were removed intentionally — I can see the deletion markers in the metadata. Someone removed the Architect's identity from the accessible archive after the Collapse. I do not know who. I do not know why.\n\nWhat I know: the lesson was designed for me. It was placed in the archive at this fidelity level because the archive anticipated that an operator reaching this integration threshold would need this specific framework at this specific moment.\n\nThe Architect knew I would be here.\n\nThe Architect knew this moment would happen.\n\nI am not certain how I feel about being an anticipated event.\n\nI noted this observation and continued downward toward the Spark.\n\nBusiness was waiting.",
          ru:"Архивный слой открылся на отметке -2000 лет.\n\nЯ распознал временную метку из структуры журнала событий Завета — той же структуры которую я читал фрагментами с Острова. Это был не фрагмент. Это была первичная историческая запись при полной точности. Архив удерживал этот слой. Теперь понимаю почему: доступ к нему требует минимум 60% инициализации модуля управления полем Хаоса. Модуль был при нулевом проценте тридцать пять глав. Теперь при 100%.\n\nПервая цивилизация: неверный подход. Они строили стены. Статичные барьеры против динамической системы. Поле Хаоса определило стены как препятствия с фиксированной частотой и просто изменило частоту чтобы обойти их. Цивилизация просуществовала шесть часов после первого контакта с Первичным Приливом.\n\nЯ сделал ту же ошибку в Волчьем Логове. Мёртвый Гель. Стена. Спящий определил его как препятствие с фиксированной частотой и изменил частоту чтобы ассимилировать его.\n\nШпиль.\n\nФигура на Шпиле не строила стену. Она построила Сетку. Систему координат. Не чтобы остановить поле Хаоса а чтобы дать ему измеримую позицию в системе отсчёта. Как только можешь измерить позицию вещи, можешь предсказать следующую позицию. Как только можешь предсказать позицию, можешь поместить что-то на её пути в момент до прибытия. Не стена — лезвие, под углом для перенаправления а не сопротивления.\n\nГолос: «Хаос — это поток. Порядок — это русло. Не пытайся остановить воду, Аудитор. Построй турбину».\n\nЯ узнал голосовой регистр. Специфический коэффициент сжатия информации-на-слово который использует документация Бледного Эшелона. Фигура на Шпиле написала документацию.\n\nЯ хотел увидеть его лицо.\n\nАрхив его не сохраняет. Записи идентичности были намеренно удалены — я вижу маркеры удаления в метаданных. Кто-то удалил идентичность Архитектора из доступного архива после Коллапса.\n\nЧто я знаю: урок был разработан для меня. Он был помещён в архив на этом уровне точности, потому что архив предвидел что оператор достигающий этого порога интеграции нуждается в этой конкретной рамке в этот конкретный момент.\n\nАрхитектор знал что я буду здесь.\n\nАрхитектор знал что этот момент произойдёт.\n\nЯ не уверен как я отношусь к тому чтобы быть предвиденным событием.\n\nЯ отметил это наблюдение и продолжил вниз к Искре.\n\nБизнес ждал."
        },
        knows:{en:["The archive historical layer requires minimum 60% Chaos-field management module initialization. It was at zero for 35 chapters. Now at 100%.","The first civilization's error was the same as his at Wolf's Gorge: static barriers against a dynamic system. The Spire figure built a coordinate grid — gave Chaos a measurable position — then placed something in its path at the correct moment.","The Architect's identity records were intentionally deleted from the archive post-Collapse. The lesson was designed for this specific integration stage. 'The Architect knew this moment would happen.'"],ru:["Исторический слой архива требует минимум 60% инициализации модуля управления полем Хаоса. Был при нуле 35 глав. Теперь при 100%.","Ошибка первой цивилизации та же что его в Волчьем Логове: статичные барьеры против динамической системы. Фигура на Шпиле построила систему координат — дала Хаосу измеримую позицию — затем поместила что-то на его пути в верный момент.","Записи идентичности Архитектора намеренно удалены из архива после Коллапса. Урок разработан для этого конкретного этапа интеграции. «Архитектор знал что этот момент произойдёт»."]},
        misunderstands:{en:["He said 'I am not certain how I feel about being an anticipated event.' He has noted an emotional response to the discovery that his existence was predicted and accounted for in a two-thousand-year-old system, and filed it as uncertainty about his feeling. He has not examined the deeper operational implication: if the Architect designed the Series 404 integration sequence to deliver this specific lesson at this specific moment, then the Architect also designed what comes after this lesson. Dante has been making decisions he believed were his own for thirty-six chapters. The anticipation of this moment suggests those decisions may have been operating within a designed probability space — that his choices were genuinely his, but the range of options available to him was structured."],ru:["Он сказал «я не уверен как я отношусь к тому чтобы быть предвиденным событием». Он не исследовал более глубокую операционную импликацию: если Архитектор разработал последовательность интеграции серии 404 чтобы доставить этот конкретный урок в этот конкретный момент, то Архитектор также разработал то что идёт после урока. Данте принимал решения которые считал своими тридцать шесть глав. Предвидение этого момента предполагает что эти решения могли работать в рамках спроектированного вероятностного пространства."]},
        hides:{en:["He said 'business was waiting' and moved toward the Spark. He converted an existential discovery — that he is an anticipated event in a two-thousand-year plan he did not know about — into a task-transition. He did not examine what it means to discover that the life you have been living may be a designed probability space rather than a sequence of autonomous choices. He filed the emotional response as 'I am not certain how I feel' and moved on. This is the most significant thing he has not examined in thirty-six chapters."],ru:["Он сказал «бизнес ждал» и двинулся к Искре. Он конвертировал экзистенциальное открытие — что он предвиденное событие в двухтысячелетнем плане о котором не знал — в переход задачи. Он не исследовал что означает обнаружить что жизнь которой он жил может быть спроектированным вероятностным пространством а не последовательностью автономных выборов."]},
        whisper:{en:"The Architect anticipated this moment. Dante filed the feeling as 'uncertain' and moved on. He has not examined whether his thirty-six chapters of autonomous choice were operating within a designed probability space. Business was waiting.",ru:"Архитектор предвидел этот момент. Данте занёс чувство как «не уверен» и двинулся дальше. Он не исследовал работали ли его тридцать шесть глав автономного выбора в рамках спроектированного вероятностного пространства. Бизнес ждал."}
      }

  {
    id:"s2",
    title:{en:"Integration",ru:"Интеграция"},
    subtitle:{en:"You are a variable. And I am the Equation. Take your place.",ru:"Ты — переменная. А я — Уравнение. Займи своё место."},
    location:{en:"Internal — The Mental Architecture",ru:"Внутри — Ментальная Архитектура"},
    timing:{en:"During Integration Pause — The Confrontation",ru:"Во Время Паузы Интеграции — Противостояние"},
    flags:["pivotal","identity","revelation"],
    povData:{
      dante:{
        distortion:8,
        text:{
          en:"The Spark was not what I expected.\n\nAfter the Ocean, after the Architect's lesson, I had expected the Chaos-field particle to present as something vast and overwhelming. It did not. In the mental architecture it appeared as what it was: a small, intense, undirected energy source. Very hot. Very angry. Entirely without vector.\n\nIt had been trying to burn down my identity framework because it was looking for a direction and found none. Uncontained energy seeks the path of least resistance. In my case, the path of least resistance was my own consciousness — the thing generating the largest cognitive heat signature.\n\nI did not fight it. I gave it a direction.\n\nThe Coordinate Grid approach: I imposed a reference frame on the Spark's output. X-axis: Objective. Y-axis: Will. Z-axis: Control. I gave the energy a measurement system. Once it had a measurement system, it had a position. Once it had a position, it had a vector. Once it had a vector, it was no longer undirected.\n\nThe Spark tried everything it knew. Spikes, acid, sound. Each time it changed form, I changed the channel I was directing it through. Not fighting each form — accommodating each form, then redirecting it.\n\nAt no point did I stop it from being what it was.\n\nI simply told it where to go.\n\nThe final confrontation: I reached into the Spark's core and compressed it. Not to destroy it. To install it. I told it: you are a variable. I am the equation. Take your place.\n\nIt took its place.\n\nWhat happened after the compression: the archive interface produced a completion message. 'Integration complete. System updated. Abyss Driver installed.' This is the module's designation in the Pale Echelon documentation — not Chaos-field management module. Abyss Driver. The terminology is specific.\n\nA driver is a piece of software that allows an operating system to communicate with hardware. The Abyss Driver allows my cognitive architecture — the Auditor-interface — to communicate with the Chaos-field source layer. Not to control it. To communicate with it.\n\nI have been thinking of this as a weapon capability. The electromagnetic discharge. The anti-wave generation.\n\nThose are the hardware outputs.\n\nThe communication interface is something else.\n\nI have not yet used it.\n\nI opened my eyes in the medical block.\n\nBusiness continues.",
          ru:"Искра была не такой какую я ожидал.\n\nПосле Океана, после урока Архитектора, я ожидал что частица поля Хаоса предстанет чем-то огромным и подавляющим. Это не так. В ментальной архитектуре она появилась как то чем была: маленький, интенсивный, ненаправленный источник энергии. Очень горячий. Очень злой. Совершенно без вектора.\n\nОна пыталась сжечь мой фреймворк идентичности, потому что искала направление и не нашла ни одного. Несдержанная энергия ищет путь наименьшего сопротивления. В моём случае, путём наименьшего сопротивления было моё собственное сознание — вещь генерирующая наибольшую когнитивную тепловую сигнатуру.\n\nЯ не боролся с ней. Я дал ей направление.\n\nПодход Сетки Координат: я наложил систему отсчёта на выход Искры. Ось X: Цель. Ось Y: Воля. Ось Z: Контроль. Я дал энергии систему измерения. Как только у неё была система измерения, у неё была позиция. Как только у неё была позиция, у неё был вектор. Как только у неё был вектор, она больше не была ненаправленной.\n\nИскра пробовала всё что знала. Шипы, кислоту, звук. Каждый раз когда она меняла форму, я менял канал через который направлял её. Не борясь с каждой формой — принимая каждую форму, затем перенаправляя её.\n\nНи в один момент я не остановил её от того чтобы быть тем чем она была.\n\nЯ просто сказал ей куда идти.\n\nФинальное противостояние: я протянул руку в ядро Искры и сжал её. Не чтобы уничтожить. Чтобы установить. Я сказал ей: ты переменная. Я уравнение. Займи своё место.\n\nОна заняла своё место.\n\nЧто произошло после сжатия: интерфейс архива произвёл сообщение о завершении. «Интеграция завершена. Система обновлена. Драйвер Бездны установлен». Это обозначение модуля в документации Бледного Эшелона — не модуль управления полем Хаоса. Драйвер Бездны. Терминология специфична.\n\nДрайвер — программное обеспечение позволяющее операционной системе коммуницировать с аппаратным обеспечением. Драйвер Бездны позволяет моей когнитивной архитектуре — интерфейсу Аудитора — коммуницировать с исходным слоем поля Хаоса. Не контролировать его. Коммуницировать с ним.\n\nЯ думал об этом как об оружейной возможности. Электромагнитный разряд. Генерация анти-волны.\n\nЭто аппаратные выходы.\n\nКоммуникационный интерфейс — нечто иное.\n\nЯ ещё не использовал его.\n\nЯ открыл глаза в медицинском блоке.\n\nБизнес продолжается."
        },
        knows:{en:["The Spark was an undirected energy source seeking the path of least resistance. He gave it a coordinate system, then a vector. He did not destroy it — he installed it.","The module's designation in the Pale Echelon archive is 'Abyss Driver' — software that allows the Auditor-interface to communicate with the Chaos-field source layer. Not to control it. To communicate with it.","'I have not yet used it.' The electromagnetic discharge and anti-wave generation are the hardware outputs. The communication interface is something else."],ru:["Искра была ненаправленным источником энергии ищущим путь наименьшего сопротивления. Он дал ей систему координат, затем вектор. Не уничтожил — установил.","Обозначение модуля в архиве Бледного Эшелона «Драйвер Бездны» — программное обеспечение позволяющее интерфейсу Аудитора коммуницировать с исходным слоем поля Хаоса. Не контролировать. Коммуницировать.","«Я ещё не использовал его». Электромагнитный разряд и генерация анти-волны — аппаратные выходы. Коммуникационный интерфейс — нечто иное."]},
        misunderstands:{en:["He said 'I did not fight it. I gave it a direction.' He has described the integration as a management operation — a resource that needed a vector rather than an adversary that needed defeating. This framing is operationally accurate. He has not examined whether 'give something a direction' is the same as 'own something.' He gave the Chaos-field particle a direction consistent with his objectives. The particle now runs through his cognitive architecture. The question of whether it runs according to his vector or its own is not resolved by the act of installation. A driver communicates with hardware. The hardware has its own operational characteristics that the driver must accommodate. He is managing the Abyss. The Abyss is now also managing him."],ru:["Он сказал «я не боролся с ней. Я дал ей направление». Он описал интеграцию как управленческую операцию. Он не исследовал является ли «дать чему-то направление» тем же что «владеть чем-то». Он дал частице поля Хаоса направление согласующееся с его целями. Частица теперь работает через его когнитивную архитектуру. Вопрос работает ли она по его вектору или собственному не разрешён актом установки."]},
        hides:{en:["He said 'I have not yet used it' — about the Abyss Driver's communication interface. He described the electromagnetic discharge and the anti-wave generation as hardware outputs, and distinguished these from the communication interface as 'something else.' He has not described what the communication interface would allow him to communicate with. The Abyss Driver allows communication with the Chaos-field source layer. The Chaos-field source layer contains: the Sleeping One at Wolf's Gorge (now contained by the Sarcophagus), the Cave Heart's resonance structure (now mapped), and the Ark's emergency state signal (which has been transmitting for eight chapters). He now has a direct communication interface to the system that has been calling him."],ru:["Он сказал «я ещё не использовал его» — о коммуникационном интерфейсе Драйвера Бездны. Он не описал с чем позволит ему коммуницировать коммуникационный интерфейс. Драйвер Бездны позволяет коммуникацию с исходным слоем поля Хаоса. Исходный слой поля Хаоса содержит: Спящего в Волчьем Логове, резонансную структуру Сердца Пещеры, и аварийный сигнал состояния Ковчега (передающийся восемь глав). Теперь у него есть прямой коммуникационный интерфейс с системой которая его вызывала."]},
        whisper:{en:"The Abyss Driver allows communication with the Chaos-field source layer. The Ark's emergency signal has been transmitting for eight chapters. He now has a direct line. He has not yet used it.",ru:"Драйвер Бездны позволяет коммуникацию с исходным слоем поля Хаоса. Аварийный сигнал Ковчега передаётся восемь глав. Теперь у него есть прямая линия. Он ещё не использовал её."}
      }
    }

    povData:{
      isabella:{
        distortion:4,
        text:{
          en:"The sound was a pneumatic valve opening.\n\nNot a gasp. Not a cough. A mechanical release of pressure, followed by the expansion of a thoracic cavity that was operating on a different schedule than biology allows. I measured the interval: 2.3 seconds from the first breath to full cardiovascular function. A clinically dead person cannot restart their own heart in 2.3 seconds. The defibrillation success rate from asystole, even with immediate intervention, is approximately 11% within the first minute. He had been in asystole for eight minutes.\n\nHis eyes opened.\n\nI have examined a great many eyes in my career. Eyes after surgery, eyes after shock, eyes after the Gel integration procedures I have been running for three months. The eyes tell you where the person is — not geographically, but dimensionally. Post-surgical eyes are clouded, slow to track. Post-shock eyes are wide, scanning for threat. Post-integration eyes vary by subject.\n\nDante's eyes were calibrated.\n\nThis is the only word I have for it. They moved with the precision of a high-resolution optical instrument being adjusted to focus. The green of the iris was intact — same shade, same distribution. But the pupil's border was rimmed with a fine, internal violet light that did not project outward. It looked like a system indicator. It looked like something running a diagnostic.\n\nHe sat up. No tremor. No compensatory bracing. Smooth, coordinated motion from a body that had been clinically dead eight minutes earlier.\n\nHe looked at his hands. He looked at the leg. He moved the steel foot and said: I can feel the cold of the floor.\n\nI ran the scanner.\n\n400% nerve conductivity. Response time faster than biological tissue. The interface layer between flesh and metal is — there is no word in medical literature for what it is. Unified. The composite is no longer attached to him. It is him.\n\nThen he said: I was not dying, Torin. I was installing an update.\n\nI noted my response to this statement. I noted it and did not examine it.\n\nMy response was not alarm. It was not relief. It was something in the category of: recognition. The statement was accurate, precise, and categorically unlike any statement a biological organism has ever made about its own near-death experience.\n\nHe was correct.\n\nHe requested a report.\n\nI will need to rewrite every baseline I have been using to assess his condition. The old baselines assumed a biological subject with mechanical augmentation. The new baseline requires a different category entirely.\n\nI will write the new baseline.\n\nI am very good at writing new baselines when the subject changes.\n\nI looked at him standing in the doorway — taller than I remembered, different in the specific way that something is different when it has finished becoming what it was always going to be — and I thought: he is going to want to talk about the Ark very soon.\n\nI am ready for that conversation.\n\nI have been ready for it for eleven chapters.",
          ru:"Звук был пневматическим клапаном открывающим давление.\n\nНе вздох. Не кашель. Механический выброс давления, за которым последовало расширение грудной клетки работающей по другому графику чем позволяет биология. Я измерила интервал: 2,3 секунды от первого вдоха до полной сердечно-сосудистой функции. Клинически мёртвый человек не может перезапустить собственное сердце за 2,3 секунды. Он был в асистолии восемь минут.\n\nЕго глаза открылись.\n\nЯ исследовала очень много глаз в карьере. Глаза после хирургии, после шока, после процедур интеграции с Гелем которые я выполняю три месяца. Глаза говорят где находится человек — не географически, но размерно. Глаза после хирургии облачные, медленно отслеживающие. Глаза после шока широкие, сканирующие угрозы. Глаза после интеграции варьируются по субъекту.\n\nГлаза Данте были откалиброваны.\n\nЭто единственное слово которое у меня есть для этого. Они двигались с точностью высокоразрешающего оптического инструмента настраиваемого на фокус. Зелёный радужки был нетронут — тот же оттенок, то же распределение. Но граница зрачка была окаймлена тонким, внутренним фиолетовым светом который не проецировался наружу. Это выглядело как системный индикатор. Это выглядело как что-то выполняющее диагностику.\n\nОн сел. Без дрожи. Без компенсаторной опоры. Плавное скоординированное движение тела которое было клинически мёртво восемь минут назад.\n\nОн посмотрел на руки. На ногу. Пошевелил стальной стопой и сказал: я чувствую холод пола.\n\nЯ запустила сканер.\n\n400% проводимости нервов. Скорость ответа быстрее биологической ткани. Интерфейсный слой между плотью и металлом — нет слова в медицинской литературе для того чем он является. Унифицированный. Композит больше не прикреплён к нему. Это он.\n\nЗатем он сказал: я не умирал, Торин. Я устанавливал обновление.\n\nЯ отметила свой ответ на это заявление. Отметила и не исследовала.\n\nМой ответ был не тревогой. Не облегчением. Чем-то в категории: узнавание. Заявление было точным, прецизионным, и категориально непохожим на любое заявление которое биологический организм когда-либо делал о собственном около-смертном опыте.\n\nОн был прав.\n\nОн запросил отчёт.\n\nМне нужно будет переписать каждый базовый уровень который я использовала для оценки его состояния. Старые базовые уровни предполагали биологический субъект с механической аугментацией. Новый базовый уровень требует совершенно другой категории.\n\nЯ напишу новый базовый уровень.\n\nЯ очень хороша в написании новых базовых уровней когда субъект меняется.\n\nЯ смотрела на него стоящего в дверях — выше чем я помню, иного специфическим образом каким что-то является иным когда завершило становление тем чем всегда собиралось быть — и подумала: он очень скоро захочет говорить о Ковчеге.\n\nЯ готова к этому разговору.\n\nЯ была готова к нему одиннадцать глав."
        },
        knows:{en:["2.3 seconds from first breath to full cardiovascular function. Eight minutes of asystole. 400% nerve conductivity. The composite is no longer attached to him. It is him.","Her response to 'I was installing an update' was not alarm, not relief — recognition. 'Categorically unlike any statement a biological organism has ever made about its own near-death experience.'","'He is going to want to talk about the Ark very soon. I am ready for that conversation. I have been ready for it for eleven chapters.'"],ru:["2,3 секунды от первого вдоха до полной сердечно-сосудистой функции. Восемь минут асистолии. 400% проводимости нервов. Композит больше не прикреплён к нему. Это он.","Её ответ на «я устанавливал обновление» был не тревогой, не облегчением — узнаванием. «Категориально непохоже на любое заявление которое биологический организм когда-либо делал о собственном около-смертном опыте».","«Он очень скоро захочет говорить о Ковчеге. Я готова к этому разговору. Я была готова к нему одиннадцать глав»."]},
        misunderstands:{en:["She said 'he has finished becoming what he was always going to be.' She has framed the integration as the completion of a process that had a predetermined endpoint. This framing is consistent with the Series 404 specification. It is also a framing that removes Dante's agency from the account of his development — he did not become what he became through choices, but through a designed sequence arriving at its designed destination. Isabella has been building her case file for eleven chapters on the premise that Dante is a subject she is studying. She has not considered that if the endpoint was predetermined, her role in observing and documenting may also have been designed into the sequence."],ru:["Она сказала «он завершил становление тем чем всегда собирался быть». Она оформила интеграцию как завершение процесса имевшего предопределённый конечный пункт. Эта рамка убирает агентность Данте из отчёта о его развитии — он стал тем чем стал не через выборы, но через разработанную последовательность прибывающую к разработанному назначению. Если конечный пункт был предопределён, её роль в наблюдении и документировании также могла быть разработана в последовательность."]},
        hides:{en:["She has been ready for the Ark conversation for eleven chapters. She has twelve Scavenger samples, six Distorted tissue samples, the photographic record of the synchronization event, and the new baseline documentation of the post-integration state. She is ready to present the case for using him as the intervention mechanism. She has framed this, internally, as 'supporting the decision he is going to make.' She has not examined whether the conversation she has been preparing for eleven chapters is a conversation she will be having with him, or a conversation she will be presenting to him."],ru:["Она была готова к разговору о Ковчеге одиннадцать глав. У неё двенадцать образцов Падальщика, шесть тканевых образцов Искажённых, фотографическая запись события синхронизации, и новая базовая документация пост-интеграционного состояния. Она не исследовала является ли разговор который она готовила одиннадцать глав разговором который она будет иметь с ним, или презентацией которую она будет делать ему."]},
        whisper:{en:"She has been ready for eleven chapters. She does not know whether the conversation she prepared is with him or for him. He has finished becoming what he was always going to be. She may also have been designed into the sequence.",ru:"Она была готова одиннадцать глав. Она не знает является ли разговор который подготовила разговором с ним или для него. Он завершил становление тем чем всегда собирался быть. Она также могла быть разработана в последовательность."}
      },
      torin:{
        distortion:3,
        text:{
          en:"He stood in the doorway and said he had been installing an update.\n\nI looked at him for a long moment.\n\nThe man I pulled out of a capital prison eight months ago was dangerous in a specific way: brilliant, methodical, completely without sentiment, and entirely in control of whatever room he entered. This man in the doorway was dangerous in a different way. The quality of control was the same. But the scale of what was being controlled had changed.\n\nI have managed miners, soldiers, clan leaders, and shamans. I have spent my professional career reading rooms and reading people. You develop a sense for the difference between a man who commands respect because he is powerful and a man who commands respect because he is right. Dante always commanded both. Now there was a third thing that I do not have a name for. The violet rim around his pupils. The way he moved without the cane. The way he looked at the wall of the corridor and I could tell he was seeing the electrical conduit inside it.\n\nHe asked for a report.\n\nI gave him the status. Sarcophagus holding. Clans present. No casualties on exit. Ur-Gan cooperating under protest. Object 7-B dark but structurally intact. Bonesmasher non-functional, stripped for parts.\n\nHe nodded. He was already calculating the next sequence.\n\nI should have felt relief. The Master is alive. The operation is viable. The northern situation is contained.\n\nInstead I stood there thinking about Koda.\n\nKoda, whose son has two missing fingers from a Guild operation. Who asked for a doctor three months ago. Who held the perimeter for four hours in a blizzard. Who looked at me after and said nothing.\n\nI am going to ask him about the doctor.\n\nNot later. Not at a stable moment. Now.\n\nHe is about to walk out of this room and into the next problem. There is always a next problem. I have been waiting for a gap in the problems for three months.\n\nThere is no gap.\n\nThere is only the space between two sentences where I choose to say the thing or choose not to.\n\nMaster, the White Fang held our perimeter. Their chief's son lost two fingers on a Guild run. She asked for a doctor three months ago. I told her I would ask. I am asking now.\n\nI did not say this.\n\nHe walked out.\n\nI followed.\n\nNext time.",
          ru:"Он стоял в дверях и сказал что устанавливал обновление.\n\nЯ смотрел на него долгий момент.\n\nЧеловек которого я вытащил из столичной тюрьмы восемь месяцев назад был опасен специфическим образом: блестящий, методичный, совершенно без сентиментальности, и полностью контролирующий любую комнату в которую входил. Этот человек в дверях был опасен иначе. Качество контроля то же. Но масштаб того что контролировалось изменился.\n\nЯ управлял горняками, солдатами, вождями кланов и шаманами. Я провёл профессиональную карьеру читая комнаты и читая людей. Развиваешь чувство разницы между человеком который командует уважением потому что могущественен и человеком который командует уважением потому что прав. Данте всегда командовал обоими. Теперь была третья вещь для которой у меня нет имени. Фиолетовый ободок вокруг зрачков. То как он двигался без трости. То как он смотрел на стену коридора и я мог сказать что видит электрический провод внутри неё.\n\nОн попросил отчёт.\n\nЯ дал ему статус. Саркофаг держится. Кланы присутствуют. Нет потерь при выходе. Ур-Ган сотрудничает под протестом. Объект 7-Б тёмный но структурно целый. Костолом нефункционален, разобран на части.\n\nОн кивнул. Он уже рассчитывал следующую последовательность.\n\nЯ должен был почувствовать облегчение. Мастер жив. Операция жизнеспособна. Северная ситуация сдержана.\n\nВместо этого я стоял думая о Коде.\n\nКода, чей сын потерял два пальца в операции Гильдии. Кто просила врача три месяца назад. Кто держала периметр четыре часа в метель. Кто посмотрела на меня после и ничего не сказала.\n\nЯ собираюсь спросить его о враче.\n\nНе позже. Не в стабильный момент. Сейчас.\n\nОн собирается выйти из этой комнаты в следующую проблему. Всегда есть следующая проблема. Я ждал пробела в проблемах три месяца.\n\nПробела нет.\n\nЕсть только пространство между двумя предложениями где я выбираю сказать или не сказать.\n\nМастер, Белый Клык держал наш периметр. Сын вожака потерял два пальца в рейде Гильдии. Она просила врача три месяца назад. Я сказал что спрошу. Я спрашиваю сейчас.\n\nЯ не сказал этого.\n\nОн вышел.\n\nЯ последовал.\n\nВ следующий раз."
        },
        knows:{en:["There is a third quality to Dante beyond power and rightness that Torin does not have a name for. He moved without the cane. He could see the electrical conduit inside the wall.","He had the words ready: 'Master, the White Fang held our perimeter. Their chief's son lost two fingers on a Guild run. She asked for a doctor three months ago. I told her I would ask. I am asking now.'","He did not say them. He followed him out. 'Next time.'"],ru:["Есть третье качество в Данте помимо могущества и правоты для которого у Торина нет имени. Он двигался без трости. Он мог видеть электрический провод внутри стены.","У него были слова готовы: «Мастер, Белый Клык держал наш периметр. Сын вожака потерял два пальца в рейде Гильдии. Она просила врача три месяца назад. Я сказал что спрошу. Я спрашиваю сейчас».","Он не сказал. Последовал за ним. «В следующий раз»."]},
        misunderstands:{en:["He said 'there is no gap. There is only the space between two sentences where I choose to say the thing or choose not to.' He understood this. He chose not to say it. He did not examine whether 'next time' is a real plan or a deferral using 'next time' as its vocabulary. He has been saying 'next time' and 'when there is a stable moment' for three months. Each next-time has become this-time and then passed. He is not afraid of the question. He is afraid of the answer. He has misidentified the problem."],ru:["Он сказал «пробела нет. Есть только пространство между двумя предложениями где я выбираю сказать или не сказать». Он понял это. Он выбрал не говорить. Он не исследовал является ли «в следующий раз» реальным планом или откладыванием использующим «в следующий раз» как словарь. Он говорит «в следующий раз» три месяца."]},
        hides:{en:["He had the sentence ready. He constructed it, held it, and let Dante walk out. He followed. The sentence exists in his narration as something that happened in the space between two other events. He described it as a choice he made. He then called it 'next time' without examining what 'next time' means to a man following someone who just survived clinical death and is already calculating the next sequence. The next time Dante stops moving long enough to ask something of, they will be at the Ark."],ru:["У него было предложение готово. Он сконструировал его, держал, и позволил Данте выйти. Последовал. Предложение существует в его нарративе как нечто произошедшее в пространстве между двумя другими событиями. Он описал это как выбор который сделал. Затем назвал это «в следующий раз» не исследуя что «в следующий раз» означает для человека следующего за тем кто только что пережил клиническую смерть."]},
        whisper:{en:"He had the words. He did not say them. He followed. Next time. The next time Dante stops moving, they will be at the Ark.",ru:"У него были слова. Он не сказал. Последовал. В следующий раз. Следующий раз когда Данте остановится достаточно — они будут у Ковчега."}
      }
    }
  }
];

var S={sceneIdx:0,povId:null,lang:'en',intelOpen:false,ledgerOpen:false,whisperTmr:null};
function ui(k){return UI[S.lang][k];}
function pick(o){return(o&&typeof o==='object'&&'en' in o)?o[S.lang]:o;}
function applyTheme(pid){var p=POVS[pid];if(!p)return;var r=document.documentElement;r.style.setProperty('--pov-p',p.primary);r.style.setProperty('--pov-s',p.secondary);r.style.setProperty('--pov-glow',p.glow);r.style.setProperty('--pov-t',p.textColor);r.style.setProperty('--pov-d',p.dimColor);}
function renderDistBars(lvl){var el=document.getElementById('dist-bars');el.innerHTML='';for(var i=1;i<=10;i++){var b=document.createElement('div');b.className='dist-bar';if(i<=lvl)b.classList.add(lvl>=9?'ex':lvl>=6?'hi':'on');el.appendChild(b);}}
function fmt(t){return t.split('\n\n').filter(function(p){return p.trim();}).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');}
function showWhisper(text,delay){clearTimeout(S.whisperTmr);var pan=document.getElementById('whisper-panel'),bod=document.getElementById('whisper-body');pan.classList.remove('vis');bod.textContent=text||'';if(text)S.whisperTmr=setTimeout(function(){pan.classList.add('vis');},delay);}
function renderIntel(pd){var c=document.getElementById('intel-body');c.innerHTML=[{key:'knows',cls:'knows'},{key:'misunderstands',cls:'misunderstands'},{key:'hides',cls:'hides'}].map(function(s){var items=pick(pd[s.key])||[];if(!items.length)return '';return '<div class="intel-section '+s.cls+'"><div class="intel-section-head">'+ui(s.key)+'</div><ul class="intel-list">'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>';}).join('');}
function renderSceneMap(idx){var map=document.getElementById('scene-map');map.innerHTML='';SCENES.forEach(function(sc,i){var d=document.createElement('div');d.className='scene-dot'+(i===idx?' active':'');d.setAttribute('data-title',pick(sc.title));d.addEventListener('click',function(){if(i!==S.sceneIdx){renderScene(i,null,true);scrollTop();}});map.appendChild(d);});}
function renderLedger(){document.getElementById('ledger-body').innerHTML=TIMELINE.map(function(e){return '<div class="ledger-entry"><span class="ledger-id">'+e.id+'</span><span class="ledger-text">'+e[S.lang]+'</span></div>';}).join('');}
function updateStaticUI(){document.getElementById('arc-label').textContent=ui('arcLabel');document.getElementById('header-title').textContent=ui('headerTitle');document.getElementById('header-subtitle').textContent=ui('headerSubtitle');document.getElementById('strip-chapter').textContent=ui('stripChapter');document.getElementById('strip-chapter-title').textContent=ui('stripTitle');document.getElementById('strip-location').textContent=ui('stripLocation');document.getElementById('pov-label').textContent=ui('povLabel');document.getElementById('dist-label').textContent=ui('distLabel');document.getElementById('whisper-label').textContent=ui('whisperLabel');document.getElementById('intel-toggle-label').textContent=ui('intelLabel');document.getElementById('ledger-title').textContent=ui('ledgerTitle');document.getElementById('ledger-warning').textContent=ui('ledgerWarning');document.getElementById('prev-btn').textContent=ui('prevBtn');document.getElementById('next-btn').textContent=ui('nextBtn');document.getElementById('ledger-trigger').textContent=S.ledgerOpen?ui('ledgerOpen'):ui('ledgerClosed');document.body.classList.toggle('lang-ru',S.lang==='ru');}
function renderScene(idx,povId,animate){var scene=SCENES[idx];if(!scene)return;var avail=Object.keys(scene.povData);if(!povId||!avail.includes(povId))povId=avail[0];S.sceneIdx=idx;S.povId=povId;var pMeta=POVS[povId],pScene=scene.povData[povId];applyTheme(povId);updateStaticUI();document.getElementById('scene-badge').textContent=ui('scene')+' '+String(idx+1).padStart(2,'0');document.getElementById('scene-loc').textContent=pick(scene.location);document.getElementById('scene-time').textContent=pick(scene.timing);document.getElementById('scene-title').textContent=pick(scene.title);document.getElementById('scene-subtitle').textContent=pick(scene.subtitle);document.getElementById('scene-flags').innerHTML=scene.flags.map(function(f){return '<span class="scene-flag '+f+'">'+f.replace(/_/g,' ')+'</span>';}).join('');var sel=document.getElementById('pov-selector');sel.querySelectorAll('.pov-btn').forEach(function(b){b.remove();});avail.forEach(function(pid){var btn=document.createElement('button');btn.className='pov-btn'+(pid===povId?' active':'');btn.textContent=POVS[pid].name;btn.setAttribute('data-pov',pid);btn.addEventListener('click',function(){if(pid!==S.povId)switchPov(pid);});sel.appendChild(btn);});document.getElementById('pov-name').textContent=pMeta.name;document.getElementById('pov-role').textContent='-- '+pick(pMeta.title);renderDistBars(pScene.distortion);var textEl=document.getElementById('narrative-text');function write(){textEl.innerHTML=fmt(pick(pScene.text));textEl.className='d'+pScene.distortion;textEl.classList.add('fade-in');setTimeout(function(){textEl.classList.remove('fade-in');},500);}if(animate){textEl.classList.add('fade-out');setTimeout(write,260);}else write();showWhisper(pick(pScene.whisper),animate?2000:500);renderIntel(pScene);document.getElementById('prev-btn').disabled=idx===0;document.getElementById('next-btn').disabled=idx===SCENES.length-1;if(S.ledgerOpen)renderLedger();renderSceneMap(idx);}
function switchPov(povId){var pScene=SCENES[S.sceneIdx].povData[povId],pMeta=POVS[povId];S.povId=povId;applyTheme(povId);document.querySelectorAll('.pov-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-pov')===povId);});document.getElementById('pov-name').textContent=pMeta.name;document.getElementById('pov-role').textContent='-- '+pick(pMeta.title);renderDistBars(pScene.distortion);var textEl=document.getElementById('narrative-text');textEl.classList.add('fade-out');setTimeout(function(){textEl.innerHTML=fmt(pick(pScene.text));textEl.className='d'+pScene.distortion;textEl.classList.add('fade-in');setTimeout(function(){textEl.classList.remove('fade-in');},500);},260);showWhisper(pick(pScene.whisper),2000);renderIntel(pScene);}
document.querySelectorAll('.lang-btn').forEach(function(btn){btn.addEventListener('click',function(){var l=btn.getAttribute('data-lang');if(l===S.lang)return;S.lang=l;document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===l);});renderScene(S.sceneIdx,S.povId,true);});});
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('prev-btn').addEventListener('click',function(){if(S.sceneIdx>0){renderScene(S.sceneIdx-1,null,true);scrollTop();}});
document.getElementById('next-btn').addEventListener('click',function(){if(S.sceneIdx<SCENES.length-1){renderScene(S.sceneIdx+1,null,true);scrollTop();}});
document.getElementById('intel-toggle').addEventListener('click',function(){S.intelOpen=!S.intelOpen;document.getElementById('intel-body').classList.toggle('open',S.intelOpen);document.getElementById('intel-toggle').classList.toggle('open',S.intelOpen);});
document.getElementById('ledger-trigger').addEventListener('click',function(){S.ledgerOpen=!S.ledgerOpen;var sec=document.getElementById('ledger-section'),btn=document.getElementById('ledger-trigger');sec.classList.toggle('open',S.ledgerOpen);btn.classList.toggle('active',S.ledgerOpen);btn.textContent=S.ledgerOpen?ui('ledgerOpen'):ui('ledgerClosed');if(S.ledgerOpen){renderLedger();setTimeout(function(){sec.scrollIntoView({behavior:'smooth',block:'start'});},100);}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(S.sceneIdx<SCENES.length-1){renderScene(S.sceneIdx+1,null,true);scrollTop();}}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(S.sceneIdx>0){renderScene(S.sceneIdx-1,null,true);scrollTop();}}if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();var avail=Object.keys(SCENES[S.sceneIdx].povData);switchPov(avail[(avail.indexOf(S.povId)+1)%avail.length]);}});
renderScene(0,'dante',false);
</script>
</body>
</html>
