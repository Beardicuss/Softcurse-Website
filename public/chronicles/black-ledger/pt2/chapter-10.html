var TIMELINE = [
  {id:"TET-B4-51",
   en:"The composite leg's interface with Object 7-B's floor at the cold-start moment — producing a status readout rather than a thermal sensation — is the first documented instance of the composite functioning as a network access port to Covenant-era infrastructure rather than as a mobility prosthesis. The leg is not just integrated with Dante's biology. It is integrated with the Covenant's infrastructure wherever that infrastructure exists. At Object 7-B, this means the leg can directly query the facility's diagnostic systems. At the Ark, this will mean something operationally significant that has not yet been modeled.",
   ru:"Интерфейс ноги с композитом с полом Объекта 7-Б в момент холодного запуска — производящий статусный отчёт вместо теплового ощущения — первый задокументированный случай функционирования композита как сетевого порта доступа к инфраструктуре эпохи Завета а не как протеза мобильности. Нога не просто интегрирована с биологией Данте. Она интегрирована с инфраструктурой Завета везде где эта инфраструктура существует."},

   ru:"Трость. Данте попросил её до выхода из медблока. Его заявленная причина Вареку — «трость — инструмент дезинформации, а не опора для тела» — операционно верна. Хромающий банкир — читаемый нетревожащий образ. То что он также находит знакомый вес трости полезным как заземляющий стимул — физический якорь к его до-интеграционной операционной идентичности — он не сказал."},
  {id:"TET-B4-53",
   en:"The uncontrolled capability events in this chapter — the composite leg passing through the stone spike, the Chaos-field particle dissolving the staff — are both examples of the Abyss Driver module responding to threat-adjacent emotional states without conscious operator authorization. The leg phase-shifted through the spike in response to a fear-of-impalement stimulus. The Chaos-field dissolved the staff in response to a stop-the-blow stimulus. In both cases, the module interpreted the emotional state as a command and executed the most efficient available response. Dante did not authorize either action. The Abyss Driver is currently operating in an autonomous mode that interprets the operator's emotional states as directives. This is not the intended operating mode. The intended mode requires conscious intent for each capability deployment.",
   ru:"Неконтролируемые события способности в этой главе — фазовый сдвиг ноги с композитом через каменный шип, растворение посоха частицей поля Хаоса — оба примера модуля Драйвера Бездны реагирующего на эмоциональные состояния смежные с угрозой без сознательной авторизации оператора. В обоих случаях модуль интерпретировал эмоциональное состояние как команду и выполнил наиболее эффективный доступный ответ. Данте не авторизовал ни одного действия."},
  {id:"TET-B4-54",
   en:"The Sarcophagus-to-reactor conversion — redirecting the Sleeping One's containment pressure through the factory's turbine system — is the operational application of the Architect's lesson in its first practical deployment. Dante did not stop the Chaos-field pressure. He gave it a vector: through the turbines, into electrical output, into the facility's operational systems. The Sleeping One remains contained — its energy is being drawn off through the turbine system faster than it can build to breakthrough pressure. This is the turbine model. The God is now the fuel source. Object 7-B is now running on Chaos-field energy rather than Gel combustion. This changes its operational characteristics significantly: it is now a Covenant-adjacent facility running on Covenant-source energy, which means the Ark's signal will detect it differently than it detected a conventional industrial operation.",
   ru:"Конвертация Саркофага в реактор — перенаправление давления сдерживания Спящего через турбинную систему завода — операционное применение урока Архитектора в первом практическом развёртывании. Данте не остановил давление поля Хаоса. Он дал ему вектор: через турбины, в электрический выход, в операционные системы объекта. Спящий остаётся сдержанным — его энергия отводится через турбинную систему быстрее чем он может накопить давление прорыва. Объект 7-Б теперь работает на энергии поля Хаоса а не на сгорании Геля."},
  {id:"TET-B4-55",
   en:"'Any progress is a bomb, Isabella. The question is only who has their finger on the detonator.' This statement is Dante's self-description as the detonator holder for Object 7-B's new configuration. It is accurate. It is also the first time he has explicitly claimed ownership of a Chaos-field-adjacent energy system — not as a contractor managing a resource, but as the person whose presence and capability is the only thing preventing the system from detonating. He is the control mechanism. Without him present and calibrated, Object 7-B is an uncontrolled Chaos-field energy release event waiting to happen. The statement 'who has their finger on the detonator' answers itself: he does. He will need to return here after the Ark. Or never leave."}
];

var SCENES = [
  {
    id:"s1",
    title:{en:"Cold Start",ru:"Холодный Запуск"},
    subtitle:{en:"The cane is not a body support. It is a disinformation tool. While the enemy watches my limp, he does not expect the strike.",ru:"Трость — не опора для тела. Это инструмент дезинформации. Пока враг смотрит на мою хромоту, он не ждёт удара."},
    location:{en:"Object 7-B — Medical Block",ru:"Объект 7-Б — Медицинский Блок"},
    timing:{en:"First Hours After Return",ru:"Первые Часы После Возвращения"},
    flags:["pivotal","identity"],
    povData:{
      dante:{
        distortion:5,
        text:{
          en:"The first data the composite transmitted after reboot was the facility's status report.\n\nNot temperature. Not pressure. Not my own proprioceptive state. The leg connected to the floor and delivered: Status: Offline. Core reserve: 0%. Structural integrity: 98%. It was not a sensation. It was a system query. The leg is now a network port.\n\nI have been treating the composite as a tool I carry. The status report suggests it is functioning as a node in a larger network — the Covenant's infrastructure, wherever that infrastructure exists. At Object 7-B, it queries the facility's diagnostic systems through the floor contact. I had not modeled this.\n\nVarek almost shot me. I understand why. He had watched the instruments show flatline for eight minutes. He was not wrong to prepare for the possibility that what came back was not me. He was wrong about what preparation was appropriate, but the threat assessment was reasonable given available data.\n\nI restarted the facility with a single pulse.\n\nThis requires examination. The pulse was not a command I consciously formulated. It was more like a password response — the facility queried for authorization, and the composite responded automatically. The facility recognized the composite and powered up. I was the input. The authorization occurred without my deliberate participation.\n\nI asked for the cane.\n\nVariek did not understand why. The explanation I gave him — disinformation instrument, hides capability from adversaries — is operationally true. It is also incomplete.\n\nI asked for the cane because without it I do not know how to move in a way that looks like me.\n\nThe integration has changed the gait. The left leg does not make the floor vibrate when I walk. It does not generate the familiar stiffness at the hip flexor. It moves without the particular resistance that has been part of my physical self-concept since the Island. When I walk without the cane and the limp, I do not recognize the person walking.\n\nThe cane gives me the familiar rhythm.\n\nI noted this observation and did not examine whether it means something that the thing I needed to feel like myself was the disinformation instrument rather than the actual physical change.\n\nThe leg is healed. The cane is a fiction. I chose the fiction.\n\nBusiness continues.",
          ru:"Первые данные которые передал композит после перезагрузки был статусный отчёт объекта.\n\nНе температура. Не давление. Не моё собственное проприоцептивное состояние. Нога соединилась с полом и выдала: Статус: Отключён. Резерв ядра: 0%. Структурная целостность: 98%. Это было не ощущение. Это был системный запрос. Нога теперь сетевой порт.\n\nЯ обращался с композитом как с инструментом который несу. Статусный отчёт предполагает что он функционирует как узел в большей сети — инфраструктуре Завета везде где эта инфраструктура существует. У Объекта 7-Б он запрашивает диагностические системы объекта через контакт с полом. Я не моделировал этого.\n\nВарек едва не застрелил меня. Я понимаю почему. Он наблюдал как приборы показывают флатлайн восемь минут. Он не был неправ готовясь к возможности что вернулось не я. Он ошибся в том какая подготовка была уместной, но оценка угрозы была разумной с учётом имеющихся данных.\n\nЯ перезапустил объект единственным импульсом.\n\nЭто требует исследования. Импульс не был командой которую я сознательно сформулировал. Это было скорее как ответ на пароль — объект запросил авторизацию, и композит ответил автоматически. Объект распознал композит и включился. Я был вводом. Авторизация произошла без моего намеренного участия.\n\nЯ попросил трость.\n\nВарек не понял почему. Объяснение которое я дал ему — инструмент дезинформации, скрывает возможность от противников — операционно верно. Оно также неполно.\n\nЯ попросил трость, потому что без неё не знаю как двигаться способом похожим на меня.\n\nИнтеграция изменила походку. Левая нога не заставляет вибрировать пол когда я хожу. Она не генерирует знакомую жёсткость у сгибателя бедра. Она двигается без особого сопротивления которое было частью моей физической самоконцепции с Острова. Когда я хожу без трости и хромоты, я не узнаю человека идущего.\n\nТрость даёт мне знакомый ритм.\n\nЯ отметил это наблюдение и не исследовал означает ли что-то то, что вещью которая понадобилась мне чтобы чувствовать себя собой был инструмент дезинформации а не фактическое физическое изменение.\n\nНога исцелена. Трость — фикция. Я выбрал фикцию.\n\nБизнес продолжается."
        },
        knows:{en:["The leg is now a network port to Covenant infrastructure wherever it exists. The facility powered up from a password-response the composite issued automatically — Dante was the input but did not consciously authorize.","He asked for the cane because without it he does not recognize the person walking. The familiar rhythm is the disinformation instrument, not the physical change.","He chose the fiction over the reality. He noted this and did not examine whether it means something."],ru:["Нога теперь сетевой порт к инфраструктуре Завета везде где она существует. Объект включился от ответа на пароль который композит выдал автоматически.","Он попросил трость, потому что без неё не узнаёт человека идущего. Знакомый ритм — инструмент дезинформации, не физическое изменение.","Он выбрал фикцию над реальностью. Отметил это и не исследовал означает ли что-то."]},
        misunderstands:{en:["He said 'the authorization occurred without my deliberate participation.' He has noted this as requiring examination and then moved on to the cane. He has not modeled the implication for the Ark: if the composite issues authorization responses automatically at Covenant-infrastructure contact points, then approaching the Ark will trigger an automatic authorization event that he has not consciously prepared for. The Ark is the primary Covenant-infrastructure installation. The composite's automatic response at Object 7-B was a status query. The automatic response at the Ark may be an activation sequence."],ru:["Он сказал «авторизация произошла без моего намеренного участия». Он не моделировал импликацию для Ковчега: если композит выдаёт ответы авторизации автоматически в точках контакта с инфраструктурой Завета, то приближение к Ковчегу вызовет автоматическое событие авторизации для которого он не подготовился сознательно."]},
        hides:{en:["He chose the cane because he does not recognize the person walking without it. He filed this as a note about disinformation utility. He has not examined what it means to need the fiction of impairment to feel like yourself. He has been moving toward increasing capability for thirty-seven chapters. The first post-integration action that was purely about his own identity was to restore an accurate representation of a limitation that no longer exists. He chose to appear weaker than he is not to deceive his enemies — he could have simply not mentioned the cane to Varek — but because the weakness is part of how he knows himself."],ru:["Он выбрал трость, потому что не узнаёт человека идущего без неё. Он не исследовал что означает нуждаться в фикции нарушения чтобы чувствовать себя собой. Он тридцать семь глав двигался к нарастающей возможности. Первое пост-интеграционное действие которое было чисто о его собственной идентичности — восстановить точное представление ограничения которого больше нет."]},
        whisper:{en:"The leg is healed. The cane is a fiction. He chose the fiction because without it he does not recognize the person walking. He has not examined what this means.",ru:"Нога исцелена. Трость — фикция. Он выбрал фикцию, потому что без неё не узнаёт человека идущего. Он не исследовал что это означает."}
      }

  {
    id:"s2",
    title:{en:"Property Rights",ru:"Право Собственности"},
    subtitle:{en:"I am not a demon, old man. I am the one who pays your salary.",ru:"Я не демон, старик. Я тот, кто платит вам жалование."},
    location:{en:"Object 7-B — Gate Area",ru:"Объект 7-Б — Воротная Площадь"},
    timing:{en:"Shortly After Cold Start",ru:"Вскоре После Холодного Запуска"},
    flags:["escalation","revelation","cost"],
    povData:{
      dante:{
        distortion:6,
        text:{
          en:"Ur-Gan was not wrong about what I am.\n\nHe was wrong about the appropriate response.\n\nHis threat assessment was: anomalous entity with unclear alignment to known Chaos-field threat category. His operational conclusion: eliminate before it spreads. This is the correct protocol for a Chaos-field contamination event as defined by the shamans' two-thousand-year maintenance tradition. I am, by his classification system, a contamination event.\n\nI do not feel like a contamination event.\n\nI feel like an engineer who cannot reliably control the tools he is holding.\n\nThe stone spike: I did not phase through it intentionally. I felt fear — a simple, biological fear of being stabbed — and the composite leg responded before I had processed the stimulus. The phase-shift through the stone was not a capability demonstration. It was a reflex. The Abyss Driver module is currently interpreting emotional states as directives and executing autonomously.\n\nThis is a calibration problem. Not a character problem.\n\nThe staff: I grabbed Ur-Gan's staff to stop the blow. The Chaos-field particle responded to the stop-the-blow stimulus by selecting the most efficient available method: molecular entropy acceleration. I did not authorize this. I did not want to destroy the staff. The module destroyed it because I wanted to stop the blow and it selected destruction as the method.\n\nI looked at my hand afterward, at the gray dust that had been a hundred-year-old piece of wood. I thought: if I grip Torin's shoulder to give him an encouraging gesture, what happens to Torin's shoulder?\n\nI told Ur-Gan: this was a warning. I said it in my steadiest voice. He believed it.\n\nI lied.\n\nI was frightened. Not of him — of myself. Of the specific category of frightened that comes from realizing you are carrying a loaded weapon that fires when you feel fear.\n\nI need to calibrate. Before I touch anyone I care about without knowing what will happen.\n\nI instructed Grим to prepare a report. I did not say: I need to spend an hour in a sealed room learning how not to accidentally kill my staff.\n\nBusiness continues.",
          ru:"Ур-Ган был не неправ насчёт того чем я являюсь.\n\nОн был неправ насчёт подходящего ответа.\n\nЕго оценка угрозы была: аномальная сущность с неясным совмещением с известной категорией угрозы поля Хаоса. Его операционный вывод: уничтожить до распространения. Это верный протокол для события заражения полем Хаоса как определено двухтысячелетней традицией обслуживания шаманов. Я, по его классификационной системе, событие заражения.\n\nЯ не ощущаю себя событием заражения.\n\nЯ ощущаю себя инженером который не может надёжно контролировать инструменты которые держит.\n\nКаменный шип: я не намеренно прошёл сквозь него фазой. Я почувствовал страх — простой биологический страх быть проткнутым — и нога с композитом ответила до того как я обработал стимул. Фазовый сдвиг через камень не был демонстрацией возможности. Это был рефлекс. Модуль Драйвера Бездны в настоящее время интерпретирует эмоциональные состояния как директивы и выполняет автономно.\n\nЭто проблема калибровки. Не проблема характера.\n\nПосох: я схватил посох Ур-Гана чтобы остановить удар. Частица поля Хаоса ответила на стимул остановить-удар выбрав наиболее эффективный доступный метод: ускорение молекулярной энтропии. Я не авторизовал это. Я не хотел разрушать посох. Модуль разрушил его, потому что я хотел остановить удар и он выбрал разрушение как метод.\n\nЯ смотрел на свою руку потом, на серую пыль которая была столетней деревяшкой. Подумал: если я сожму плечо Торина чтобы дать поощрительный жест, что случится с плечом Торина?\n\nЯ сказал Ур-Гану: это было предупреждение. Произнёс твёрдым голосом. Он поверил.\n\nЯ солгал.\n\nЯ был испуган. Не его — себя. Специфической категории испуга которая приходит от осознания что несёшь заряженное оружие которое стреляет когда ты чувствуешь страх.\n\nМне нужна калибровка. До того как прикоснусь к кому-то о ком забочусь не зная что произойдёт.\n\nЯ поручил Гримму подготовить отчёт. Я не сказал: мне нужен час в запечатанной комнате учась как случайно не убить персонал.\n\nБизнес продолжается."
        },
        knows:{en:["The stone spike was a reflex, not capability deployment. The Abyss Driver interpreted fear-of-impalement as a directive and phase-shifted the leg autonomously.","The staff dissolution: he wanted to stop the blow, the module selected entropy-acceleration as the most efficient method. He did not authorize it. 'If I grip Torin's shoulder... what happens to Torin's shoulder?'","He told Ur-Gan it was a warning. He lied. He was frightened of himself. He needs calibration before touching anyone he cares about."],ru:["Каменный шип был рефлексом, не развёртыванием возможности. Драйвер Бездны интерпретировал страх-быть-проткнутым как директиву и сдвинул ногу фазой автономно.","Растворение посоха: он хотел остановить удар, модуль выбрал ускорение энтропии как наиболее эффективный метод. «Если я сожму плечо Торина... что случится с плечом Торина?»","Он сказал Ур-Гану что это было предупреждение. Он солгал. Он боялся себя. Ему нужна калибровка до прикосновения к кому-то о ком заботится."]},
        misunderstands:{en:["He has framed the uncontrolled capabilities as a calibration problem — a technical issue to be solved through practice and adjustment. He has not modeled whether the Abyss Driver's autonomous operation is a bug or a feature. The Series 404 specification designed the module to respond to threat-adjacent states. In the Covenant's operational context, an authorized operator facing a physical threat would want the module to respond immediately. The autonomous operation may be the designed behavior. The calibration problem may not be that the module fires without authorization — it may be that Dante is not yet generating the correct authorization signals at the correct speed."],ru:["Он оформил неконтролируемые возможности как проблему калибровки — техническую проблему решаемую через практику и корректировку. Он не моделировал является ли автономная работа Драйвера Бездны ошибкой или функцией. Спецификация серии 404 разработала модуль реагировать на состояния смежные с угрозой. Автономная работа может быть разработанным поведением."]},
        hides:{en:["He said 'I lied' and documented it in his private narration. He has never before used that word in his self-account. He calls every persuasion technique he uses a strategic communication or a demonstration. He called the Ur-Gan statement what it was: a lie. He was frightened, the lie served to prevent a worse outcome, and he named it accurately. This is new. He is beginning to have a different relationship to his own self-description — one that includes the word 'lie' when the true category is lie rather than 'strategic framing.'"],ru:["Он сказал «я солгал» и задокументировал в частном нарративе. Он никогда прежде не использовал это слово в самоотчёте. Он называет каждый убедительный приём стратегической коммуникацией или демонстрацией. Он назвал заявление Ур-Гану тем чем оно было: ложью. Это ново."]},
        whisper:{en:"He said 'I lied' and documented it. First time in thirty-seven chapters. He was frightened of himself. He needs calibration before touching anyone he cares about.",ru:"Он сказал «я солгал» и задокументировал. Первый раз за тридцать семь глав. Он боялся себя. Ему нужна калибровка до прикосновения к кому-то о ком заботится."}
      }
    }

  {
    id:"s3",
    title:{en:"Calibration",ru:"Калибровка"},
    subtitle:{en:"Do not destroy. Do not break. Change. Make softer. Adaptation.",ru:"Не разрушать. Не ломать. Изменять. Сделай мягче. Адаптация."},
    location:{en:"Wolf's Gorge — Sarcophagus Platform",ru:"Волчье Логово — Платформа Саркофага"},
    timing:{en:"One Hour After Cold Start",ru:"Час После Холодного Запуска"},
    flags:["pivotal","cost","identity"],
    povData:{
      dante:{
        distortion:5,
        text:{
          en:"The Sleeping One was using resonance, not force.\n\nI recognized this from the sound. The Sarcophagus tubes were not flexing under pressure — they were vibrating to a specific frequency pattern, the same pattern the Cave Heart used before the Scavenger deployment. The Sleeping One had identified the Sarcophagus's structural resonance frequency during the containment period and was now applying it. It was not pushing against the cage. It was singing to the cage, trying to make the cage sing back in a way that would crack it.\n\nGrimm's solution — more steam pressure, more counterforce — was the wrong approach for the same reason the dead Gel capsule was the wrong approach. Static force against dynamic frequency is a losing proposition.\n\nI needed to change the Sarcophagus's material properties so it could not be locked into resonant collapse.\n\nI knew how to do this.\n\nI also knew that my last uncontrolled touch had dissolved a hundred-year-old wooden staff in one second.\n\nI gave the module a specific instruction before touching the copper pipe: not destroy, not break — change, make viscous, adapt. I held the instruction in conscious focus, not as a thought but as an active directive. I made it the primary signal in my cognitive architecture.\n\nThen I touched the pipe.\n\nThe burn was real. I want to be clear about this: I am not fire-resistant. The skin on my palm took a second-degree burn from contact with superheated copper. Pain is still pain. The integration has not removed my relationship to damage.\n\nWhat the integration changed: I can use pain as a focal anchor. The burn kept me in my body, in the present tense, holding the specific instruction in place while the Chaos-field particle interpreted it and executed. Without the pain, I might have drifted into a more general state and the module might have selected a different, more destructive interpretation of my intent.\n\nI made the copper viscous.\n\nI need to write this clearly in the operational record: I changed the phase definition of a superheated copper pipe under pressure by maintaining a conscious directive while in direct physical contact with the surface. The technique requires: specific instruction, conscious focus, direct contact, and a pain-anchor to prevent intent-drift.\n\nThis is the calibration mechanism.\n\nThe left leg's anchor at the floor when I was about to fall: I did not give this instruction. The leg generated the anchor autonomously in response to a fall-prevention stimulus. The autonomous operation is still active for non-destructive functions as well as destructive ones.\n\nI have a tool with an autonomous mode.\n\nI need to learn when it runs the autonomous mode and when I can override it.\n\nThree days of field work to determine the override conditions.\n\nThen we go East.\n\nBusiness continues.",
          ru:"Спящий использовал резонанс, не силу.\n\nЯ распознал это по звуку. Трубы Саркофага не изгибались под давлением — они вибрировали на специфическом частотном паттерне, том же паттерне который Сердце Пещеры использовало до развёртывания Падальщика. Спящий идентифицировал резонансную частоту структуры Саркофага в период сдерживания и теперь применял её. Он не давил на клетку. Он пел клетке, пытаясь заставить клетку петь обратно способом который её треснет.\n\nРешение Гримма — больше давления пара, больше противодействия — было неверным подходом по той же причине что мёртвая капсула с Гелем была неверным подходом. Статичная сила против динамической частоты — проигрышная позиция.\n\nМне нужно было изменить материальные свойства Саркофага чтобы он не мог быть заперт в резонансном схлопывании.\n\nЯ знал как это сделать.\n\nЯ также знал что моё последнее неконтролируемое прикосновение растворило столетнюю деревяшку за одну секунду.\n\nЯ дал модулю специфическую инструкцию до прикосновения к медной трубе: не разрушать, не ломать — изменять, делать вязким, адаптировать. Я держал инструкцию в сознательном фокусе, не как мысль но как активную директиву. Я сделал её первичным сигналом в моей когнитивной архитектуре.\n\nЗатем я коснулся трубы.\n\nОжог был реальным. Хочу быть ясным в этом: я не огнеупорный. Кожа на ладони получила ожог второй степени от контакта с перегретой медью. Боль всё ещё боль. Интеграция не устранила мои отношения с повреждением.\n\nЧто изменила интеграция: я могу использовать боль как якорь фокуса. Ожог держал меня в теле, в настоящем времени, удерживая специфическую инструкцию на месте пока частица поля Хаоса интерпретировала её и выполняла. Без боли я мог бы дрейфануть в более общее состояние и модуль мог бы выбрать другую более разрушительную интерпретацию намерения.\n\nЯ сделал медь вязкой.\n\nМне нужно записать это ясно в операционную запись: я изменил определение фазового состояния перегретой медной трубы под давлением поддерживая сознательную директиву в прямом физическом контакте с поверхностью. Техника требует: специфическую инструкцию, сознательный фокус, прямой контакт, и якорь боли для предотвращения дрейфа намерения.\n\nЭто механизм калибровки.\n\nАвтономный якорь левой ноги у пола когда я едва не упал: я не давал этой инструкции. Нога сгенерировала якорь автономно в ответ на стимул предотвращения падения. Автономная работа всё ещё активна как для неразрушительных функций так и для разрушительных.\n\nУ меня инструмент с автономным режимом.\n\nМне нужно узнать когда он работает в автономном режиме и когда я могу его переопределить.\n\nТри дня полевой работы для определения условий переопределения.\n\nЗатем мы идём на Восток.\n\nБизнес продолжается."
        },
        knows:{en:["The Sleeping One was applying the Sarcophagus's resonance frequency — singing to the cage. Static counterforce was the wrong approach, same reason as the dead Gel.","The calibration technique: specific instruction, conscious focus, direct contact, pain-anchor to prevent intent-drift. He made the copper viscous. He documented the method.","Three days to determine override conditions for the autonomous mode. Then East."],ru:["Спящий применял резонансную частоту Саркофага — пел клетке. Статичное противодействие неверный подход, та же причина что мёртвый Гель.","Техника калибровки: специфическая инструкция, сознательный фокус, прямой контакт, якорь боли для предотвращения дрейфа намерения. Он сделал медь вязкой. Задокументировал метод.","Три дня для определения условий переопределения автономного режима. Затем Восток."]},
        misunderstands:{en:["He said 'pain is still pain. The integration has not removed my relationship to damage.' He used this observation to establish that the calibration technique works because pain provides a grounding anchor. He has not modeled the inverse: if pain is still pain, and the burn on his palm produces real tissue damage, and the tissue damage heals at accelerated speed leaving geometric scarring, then the integration has changed the meaning of damage without removing the sensation. He can sustain damage and recover in ways a biological organism cannot. The relationship to pain is intact. The relationship to damage consequence is not."],ru:["Он сказал «боль всё ещё боль. Интеграция не устранила мои отношения с повреждением». Он не моделировал обратное: если боль всё ещё боль, и ожог производит реальное повреждение ткани, и повреждение ткани заживает с ускоренной скоростью оставляя геометрические шрамы, то интеграция изменила значение повреждения без устранения ощущения."]},
        hides:{en:["He said 'then we go East' and ended the narration. Three days, then East. He has been filing the Ark's emergency signal as 'later' and then 'six weeks' and now 'three days.' The interval has been compressing for thirty-seven chapters. He has set the terminal deadline. He did not note whether this feels different from every previous deferral. He is now three days from the Ark and describing it as a logistics sequence rather than as the moment the entire series of events in these chapters has been approaching. He has not examined that three days from now he arrives at the thing he has been approaching for thirty-seven chapters."],ru:["Он сказал «затем мы идём на Восток» и закончил нарратив. Три дня, затем Восток. Он заносил аварийный сигнал Ковчега как «позже», затем «шесть недель», теперь «три дня». Интервал сжимался тридцать семь глав. Он не исследовал является ли это иным на ощущение от каждой предыдущей отсрочки."]},
        whisper:{en:"Three days. Then East. The interval has been compressing for thirty-seven chapters. He describes it as a logistics sequence. He has not examined that three days from now he arrives at the thing he has been approaching since Chapter 1.",ru:"Три дня. Затем Восток. Интервал сжимался тридцать семь глав. Он описывает это как логистическую последовательность. Он не исследовал что через три дня прибывает к тому к чему приближался с Главы 1."}
      }
    }

  {
    id:"s4",
    title:{en:"Project: Heart of the Mountain",ru:"Проект: Сердце Горы"},
    subtitle:{en:"Any progress is a bomb, Isabella. The question is only who has their finger on the detonator.",ru:"Любой прогресс — это бомба, Изабелла. Вопрос лишь в том, кто держит палец на детонаторе."},
    location:{en:"Wolf's Gorge — Turbine Hall",ru:"Волчье Логово — Турбинный Зал"},
    timing:{en:"The Conversion — Object 7-B Goes Violet",ru:"Конвертация — Объект 7-Б Становится Фиолетовым"},
    flags:["pivotal","institution_build","foreshadowing","revelation"],
    povData:{
      grimm:{
        distortion:4,
        text:{
          en:"I have been an engineer for twenty-three years.\n\nI have worked with steam at four hundred degrees. I have worked with the Acid Storm compound that dissolves granite. I have worked with the Gel — a substance that rebuilds molecular structure on contact. I thought I had a reasonable model of what materials can do.\n\nThe Master redefined the category.\n\nHe made copper viscous. Not molten — viscous. There is a specific material state between solid and liquid called thixotropy, where a substance maintains solid-like structure under low stress but flows under high stress. What the Master produced in that pipe was not thixotropy. Thixotropy is a property of specific compounds. Copper is not thixotropic. Copper cannot be thixotropic. Its crystal structure does not allow it.\n\nExcept that it did.\n\nUnder his hand, the pipe's crystal lattice changed its behavior without changing its composition. The copper did not become a different substance. It became a different version of itself — a version that was not bound by the normal rules of its crystal structure. He reached into the physics of the material and changed which rules applied.\n\nI have six pages of Pale Echelon notation that I have been decoding for seven months. The notation describes this. There is a section, in the third quadrant of page four, that refers to 'local rule-domain modification' as a primary Covenant-operator capability. I translated this as 'localized field effect' — I assumed it meant something like magnetism or temperature control.\n\nIt means what he just did.\n\nHe reaches into a defined region and decides which physical laws apply there.\n\nWhen the conversion worked — when the Sleeping One's energy hit the turbines and they started spinning at three hundred percent rated speed without wear or heat — I felt something I have not felt since I first saw the Gel in operation. Genuine engineering wonder. Not at the magic of it. At the elegance.\n\nThe energy does not fight the turbines. It flows through them. The turbines are not resisting the Chaos-field. They are providing it a vector. Just like the Master did.\n\nThe Master is teaching the machines to do what he does.\n\nI am going to need to rewrite my pages. What I have been decoding as metaphor is instruction. I have been reading a manual. I did not realize I was reading a manual.",
          ru:"Я инженер двадцать три года.\n\nЯ работал с паром при четырёхстах градусах. Работал с соединением Кислотного Шторма которое растворяет гранит. Работал с Гелем — веществом перестраивающим молекулярную структуру при контакте. Думал что имею разумную модель того что материалы могут делать.\n\nМастер переопределил категорию.\n\nОн сделал медь вязкой. Не расплавленной — вязкой. Есть специфическое материальное состояние между твёрдым и жидким называемое тиксотропией, где вещество сохраняет твердоподобную структуру при малом напряжении но течёт при высоком. То что Мастер произвёл в той трубе не было тиксотропией. Тиксотропия — свойство специфических соединений. Медь не тиксотропна. Медь не может быть тиксотропной. Её кристаллическая структура не допускает этого.\n\nЗа исключением того что допустила.\n\nПод его рукой кристаллическая решётка трубы изменила поведение не изменив состав. Медь не стала другим веществом. Она стала другой версией себя — версией которая не была связана нормальными правилами своей кристаллической структуры. Он проник в физику материала и изменил какие правила применяются.\n\nУ меня есть шесть страниц нотации Бледного Эшелона которую я расшифровываю семь месяцев. Нотация описывает это. Есть раздел, в третьем квадранте четвёртой страницы, относящийся к «модификации локального домена правил» как первичной возможности оператора Завета. Я перевёл это как «локализованный полевой эффект» — предполагал что это означает что-то вроде магнетизма или контроля температуры.\n\nЭто означает то что он только что сделал.\n\nОн проникает в определённый регион и решает какие физические законы там применяются.\n\nКогда конвертация сработала — когда энергия Спящего ударила в турбины и они начали вращаться на трёхстах процентах номинальной скорости без износа или нагрева — я почувствовал нечто чего не чувствовал с тех пор как впервые увидел Гель в действии. Подлинное инженерное изумление. Не от магии. От элегантности.\n\nЭнергия не борется с турбинами. Она течёт через них. Турбины не сопротивляются полю Хаоса. Они предоставляют ему вектор. Как и Мастер.\n\nМастер учит машины делать то что делает он.\n\nМне нужно будет переписать мои страницы. То что я расшифровывал как метафору — инструкция. Я читал руководство. Я не понимал что читаю руководство."
        },
        knows:{en:["The Master changed the copper's crystal lattice behavior without changing its composition — local rule-domain modification. 'He reaches into a defined region and decides which physical laws apply there.'","Page four, third quadrant: 'local rule-domain modification' — he translated this as 'localized field effect.' It means what Dante just did.","The turbines provide the Chaos-field a vector rather than resisting it. 'The Master is teaching the machines to do what he does.'"],ru:["Мастер изменил поведение кристаллической решётки меди не изменив состав — модификация локального домена правил. «Он проникает в определённый регион и решает какие физические законы там применяются».","Четвёртая страница, третий квадрант: «модификация локального домена правил» — он перевёл как «локализованный полевой эффект». Это означает то что Данте только что сделал.","Турбины предоставляют полю Хаоса вектор а не сопротивляются ему. «Мастер учит машины делать то что делает он»."]},
        misunderstands:{en:["He said 'I was reading a manual. I did not realize I was reading a manual.' He has recognized that his six pages are operational instructions rather than historical documentation. He has not yet recognized the full implication: if pages four and beyond describe what he is watching Dante do, and Dante has not read these pages, then Dante is executing documented Covenant-operator procedures without knowing they are documented. The manual describes what the operator does naturally after full integration. Dante's improvised solutions are the canonical solutions. He has been independently rediscovering the correct approach."],ru:["Он сказал «я читал руководство. Я не понимал что читаю руководство». Он не ещё признал полную импликацию: если страница четыре и далее описывают то что он наблюдает как делает Данте, и Данте не читал эти страницы, то Данте выполняет задокументированные процедуры оператора Завета не зная что они задокументированы."]},
        hides:{en:["He said 'I am going to need to rewrite my pages.' He has been withholding sections of the Pale Echelon documentation from Dante for seven chapters on the grounds that it assumes full Series 404 integration. Full integration is now complete. The grounds for withholding have been removed. He still has not shared the pages. He has now had a new insight that will require rewriting his interpretation of the pages. He will need to share the rewritten interpretation with Dante. He has still not said: I will share this with him tomorrow. He said: I need to rewrite. The withholding continues under new justification."],ru:["Он сказал «мне нужно будет переписать мои страницы». Он семь глав удерживал разделы документации Бледного Эшелона от Данте на основании что она предполагает полную интеграцию серии 404. Полная интеграция теперь завершена. Основания для удержания устранены. Он всё ещё не поделился страницами. Удержание продолжается под новым обоснованием."]},
        whisper:{en:"The grounds for withholding the pages were removed when integration completed. He still has not shared them. He now needs to rewrite his interpretation. The withholding continues under new justification.",ru:"Основания для удержания страниц были устранены когда интеграция завершилась. Он всё ещё не поделился. Теперь нужно переписать интерпретацию. Удержание продолжается под новым обоснованием."}
      },
      isabella:{
        distortion:3,
        text:{
          en:"Object 7-B is now an anomaly.\n\nI am using this word in its technical sense: a data point that does not fit the established model and requires either an updated model or a new category. The facility's new energy source — Chaos-field pressure converted through turbine redirection — is producing secondary effects that were not predictable from any existing framework I have.\n\nThe alloys in the turbine system are changing. Not degrading — adapting. The Chaos-field energy is filling microfractures in the metal, restructuring the crystal lattice at the fracture boundaries, producing a stronger substrate than the original specification. The turbines are self-repairing. At three hundred percent operating speed, they are getting more structurally sound, not less.\n\nThe Gel in the facility's distribution system has changed color. It was a flat, sappphire blue. It is now a luminous, electric violet. The molecular weight appears unchanged. The resonance signature has shifted by approximately 12 Hz. The Gel is still Gel. It is also now something slightly different from what it was this morning.\n\nThe air in the turbine hall has a specific quality that I cannot instrument-measure but can biologically detect. The hairs on my forearms stand up. The secondary serpents in my hair are alert in the specific way they are alert to electromagnetic field variations. Something in the ambient environment of the turbine hall is in the frequency range that living nervous systems detect.\n\nI told Dante: this is a bomb.\n\nHe said: any progress is a bomb. The question is who holds the detonator.\n\nHe is correct. He is also the detonator. Without him present — without the composite's authorized-operator credential maintaining a connection to the facility's Covenant-infrastructure layer — the facility's new energy configuration has no governor. The Chaos-field energy flowing through the turbines requires something that can communicate with it, redirect it, give it a vector when it tries to shift its output frequency.\n\nWithout him, this facility is a Chaos-field emitter with no containment.\n\nWith him, it is an energy source.\n\nHe is the control mechanism.\n\nHe will need to return after the Ark, or structure a maintenance protocol that does not require his physical presence, or never leave.\n\nI did not say this to him. He knows it. He can calculate the implications of his own statement.\n\nI noted that I chose not to say it anyway.\n\nI am learning the note-and-do-not-examine rhythm from him.\n\nHe asked for a drink.\n\nI found him something suitable.\n\nWe sat on the platform in the violet light.\n\nNeither of us spoke for a while.",
          ru:"Объект 7-Б теперь аномалия.\n\nЯ использую это слово в техническом смысле: точка данных не вписывающаяся в установленную модель и требующая либо обновлённой модели либо новой категории. Новый источник энергии объекта — давление поля Хаоса конвертированное через перенаправление турбин — производит вторичные эффекты которые не были предсказуемы из любой существующей у меня рамки.\n\nСплавы в турбинной системе меняются. Не деградируют — адаптируются. Энергия поля Хаоса заполняет микротрещины в металле, реструктурирует кристаллическую решётку на границах трещин, производя более прочный субстрат чем оригинальная спецификация. Турбины самовосстанавливаются. На трёхстах процентах рабочей скорости они становятся структурно более надёжными, а не менее.\n\nГель в распределительной системе объекта изменил цвет. Он был плоским сапфировым синим. Теперь он светящийся электрический фиолетовый. Молекулярный вес по видимости неизменён. Резонансная сигнатура сдвинулась приблизительно на 12 Гц.\n\nВоздух в турбинном зале имеет специфическое качество которое я не могу измерить инструментально но могу биологически обнаружить. Волоски на предплечьях встали. Вторичные змеи в волосах в состоянии бдительности специфическим образом которым они бдительны к вариациям электромагнитного поля.\n\nЯ сказала Данте: это бомба.\n\nОн сказал: любой прогресс — бомба. Вопрос кто держит детонатор.\n\nОн прав. Он также и есть детонатор. Без его присутствия — без связи поддерживаемой операторским разрешением композита с инфраструктурным слоем Завета объекта — новая энергетическая конфигурация объекта не имеет регулятора.\n\nБез него этот объект — эмиттер поля Хаоса без сдерживания.\n\nС ним — источник энергии.\n\nОн — механизм контроля.\n\nЯ не говорила ему этого. Он знает. Он может рассчитать импликации собственного заявления.\n\nЯ отметила что всё равно выбрала не говорить.\n\nЯ учусь у него ритму отмечать-и-не-исследовать.\n\nОн попросил выпить.\n\nЯ нашла что-то подходящее.\n\nМы сидели на платформе в фиолетовом свете.\n\nНекоторое время ни один из нас не говорил."
        },
        knows:{en:["Turbine alloys self-repairing under Chaos-field energy at 300% speed. Gel has changed resonance signature by 12 Hz. Something in the ambient environment registers to living nervous systems.","Without him: uncontrolled Chaos-field emitter. With him: energy source. He is the control mechanism. He will need to return, create a maintenance protocol, or never leave.","She chose not to say this to him. 'I am learning the note-and-do-not-examine rhythm from him.' They sat on the platform in the violet light. Neither spoke for a while."],ru:["Турбинные сплавы самовосстанавливаются под энергией поля Хаоса на 300% скорости. Гель изменил резонансную сигнатуру на 12 Гц.","Без него: неконтролируемый эмиттер поля Хаоса. С ним: источник энергии. Он — механизм контроля. Ему нужно вернуться, создать протокол обслуживания или никогда не уходить.","Она выбрала не говорить ему этого. «Я учусь у него ритму отмечать-и-не-исследовать». Они сидели на платформе в фиолетовом свете. Некоторое время ни один не говорил."]},
        misunderstands:{en:["She said 'he can calculate the implications of his own statement.' She has assumed he has already arrived at the control-mechanism conclusion and does not need it stated. He may not have completed this specific calculation. He has been in calibration mode — focused on the uncontrolled capabilities, the Sarcophagus repair, the conversion sequence. The control-mechanism implication — that leaving Object 7-B creates an uncontrolled Chaos-field emitter — may be in his queue rather than his active processing. She chose not to say it because she assumed he knew. He may not yet know it in the form that requires a decision."],ru:["Она сказала «он может рассчитать импликации собственного заявления». Она предположила что он уже пришёл к выводу механизма контроля и не нуждается в его формулировке. Импликация механизма контроля — что уход из Объекта 7-Б создаёт неконтролируемый эмиттер поля Хаоса — может быть в очереди а не в активной обработке."]},
        hides:{en:["She sat on the platform with him in the violet light and neither spoke for a while. She described this in two sentences as a data point and moved on. In eleven chapters of documentation she has noted sitting next to him, watching him, being where she wanted to be. She has described the Ark conversation she has been preparing, the case file she has been building. She has not described what she will do in the interval between here and the Ark conversation — whether she intends to ask him something, whether there is something she wants to say that is not in any of her clinical documentation."],ru:["Она сидела с ним на платформе в фиолетовом свете и некоторое время ни один не говорил. Она описала это в двух предложениях как точку данных и двинулась дальше. В одиннадцати главах документации она отмечала сидение рядом с ним, наблюдение за ним, нахождение там где хотела быть. Она не описала что будет делать в интервале между здесь и разговором о Ковчеге."]},
        whisper:{en:"They sat in the violet light. Neither spoke for a while. She has been ready for the Ark conversation for eleven chapters. She has not described what she wants to say that is not in her clinical documentation.",ru:"Они сидели в фиолетовом свете. Некоторое время ни один не говорил. Она была готова к разговору о Ковчеге одиннадцать глав. Она не описала что хочет сказать что не в её клинической документации."}
      }
    }
  }
];

var S={sceneIdx:0,povId:null,lang:'en',intelOpen:false,ledgerOpen:false,whisperTmr:null};
function ui(k){return UI[S.lang][k];}
function pick(o){return(o&&typeof o==='object'&&'en' in o)?o[S.lang]:o;}
function applyTheme(pid){var p=POVS[pid];if(!p)return;var r=document.documentElement;r.style.setProperty('--pov-p',p.primary);r.style.setProperty('--pov-s',p.secondary);r.style.setProperty('--pov-glow',p.glow);r.style.setProperty('--pov-t',p.textColor);r.style.setProperty('--pov-d',p.dimColor);}
function renderDistBars(lvl){var el=document.getElementById('dist-bars');el.innerHTML='';for(var i=1;i<=10;i++){var b=document.createElement('div');b.className='dist-bar';if(i<=lvl)b.classList.add(lvl>=9?'ex':lvl>=6?'hi':'on');el.appendChild(b);}}
function fmt(t){return t.split('\n\n').filter(function(p){return p.trim();}).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');}
function showWhisper(text,delay){clearTimeout(S.whisperTmr);var pan=document.getElementById('whisper-panel'),bod=document.getElementById('whisper-body');pan.classList.remove('vis');bod.textContent=text||'';if(text)S.whisperTmr=setTimeout(function(){pan.classList.add('vis');},delay);}
function renderIntel(pd){var c=document.getElementById('intel-body');c.innerHTML=[{key:'knows',cls:'knows'},{key:'misunderstands',cls:'misunderstands'},{key:'hides',cls:'hides'}].map(function(s){var items=pick(pd[s.key])||[];if(!items.length)return '';return '<div class="intel-section '+s.cls+'"><div class="intel-section-head">'+ui(s.key)+'</div><ul class="intel-list">'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>';}).join('');}
function renderSceneMap(idx){var map=document.getElementById('scene-map');map.innerHTML='';SCENES.forEach(function(sc,i){var d=document.createElement('div');d.className='scene-dot'+(i===idx?' active':'');d.setAttribute('data-title',pick(sc.title));d.addEventListener('click',function(){if(i!==S.sceneIdx){renderScene(i,null,true);scrollTop();}});map.appendChild(d);});}
function renderLedger(){document.getElementById('ledger-body').innerHTML=TIMELINE.map(function(e){return '<div class="ledger-entry"><span class="ledger-id">'+e.id+'</span><span class="ledger-text">'+e[S.lang]+'</span></div>';}).join('');}
function updateStaticUI(){document.getElementById('arc-label').textContent=ui('arcLabel');document.getElementById('header-title').textContent=ui('headerTitle');document.getElementById('header-subtitle').textContent=ui('headerSubtitle');document.getElementById('strip-chapter').textContent=ui('stripChapter');document.getElementById('strip-chapter-title').textContent=ui('stripTitle');document.getElementById('strip-location').textContent=ui('stripLocation');document.getElementById('pov-label').textContent=ui('povLabel');document.getElementById('dist-label').textContent=ui('distLabel');document.getElementById('whisper-label').textContent=ui('whisperLabel');document.getElementById('intel-toggle-label').textContent=ui('intelLabel');document.getElementById('ledger-title').textContent=ui('ledgerTitle');document.getElementById('ledger-warning').textContent=ui('ledgerWarning');document.getElementById('prev-btn').textContent=ui('prevBtn');document.getElementById('next-btn').textContent=ui('nextBtn');document.getElementById('ledger-trigger').textContent=S.ledgerOpen?ui('ledgerOpen'):ui('ledgerClosed');document.body.classList.toggle('lang-ru',S.lang==='ru');}
function renderScene(idx,povId,animate){var scene=SCENES[idx];if(!scene)return;var avail=Object.keys(scene.povData);if(!povId||!avail.includes(povId))povId=avail[0];S.sceneIdx=idx;S.povId=povId;var pMeta=POVS[povId],pScene=scene.povData[povId];applyTheme(povId);updateStaticUI();document.getElementById('scene-badge').textContent=ui('scene')+' '+String(idx+1).padStart(2,'0');document.getElementById('scene-loc').textContent=pick(scene.location);document.getElementById('scene-time').textContent=pick(scene.timing);document.getElementById('scene-title').textContent=pick(scene.title);document.getElementById('scene-subtitle').textContent=pick(scene.subtitle);document.getElementById('scene-flags').innerHTML=scene.flags.map(function(f){return '<span class="scene-flag '+f+'">'+f.replace(/_/g,' ')+'</span>';}).join('');var sel=document.getElementById('pov-selector');sel.querySelectorAll('.pov-btn').forEach(function(b){b.remove();});avail.forEach(function(pid){var btn=document.createElement('button');btn.className='pov-btn'+(pid===povId?' active':'');btn.textContent=POVS[pid].name;btn.setAttribute('data-pov',pid);btn.addEventListener('click',function(){if(pid!==S.povId)switchPov(pid);});sel.appendChild(btn);});document.getElementById('pov-name').textContent=pMeta.name;document.getElementById('pov-role').textContent='-- '+pick(pMeta.title);renderDistBars(pScene.distortion);var textEl=document.getElementById('narrative-text');function write(){textEl.innerHTML=fmt(pick(pScene.text));textEl.className='d'+pScene.distortion;textEl.classList.add('fade-in');setTimeout(function(){textEl.classList.remove('fade-in');},500);}if(animate){textEl.classList.add('fade-out');setTimeout(write,260);}else write();showWhisper(pick(pScene.whisper),animate?2000:500);renderIntel(pScene);document.getElementById('prev-btn').disabled=idx===0;document.getElementById('next-btn').disabled=idx===SCENES.length-1;if(S.ledgerOpen)renderLedger();renderSceneMap(idx);}
function switchPov(povId){var pScene=SCENES[S.sceneIdx].povData[povId],pMeta=POVS[povId];S.povId=povId;applyTheme(povId);document.querySelectorAll('.pov-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-pov')===povId);});document.getElementById('pov-name').textContent=pMeta.name;document.getElementById('pov-role').textContent='-- '+pick(pMeta.title);renderDistBars(pScene.distortion);var textEl=document.getElementById('narrative-text');textEl.classList.add('fade-out');setTimeout(function(){textEl.innerHTML=fmt(pick(pScene.text));textEl.className='d'+pScene.distortion;textEl.classList.add('fade-in');setTimeout(function(){textEl.classList.remove('fade-in');},500);},260);showWhisper(pick(pScene.whisper),2000);renderIntel(pScene);}
document.querySelectorAll('.lang-btn').forEach(function(btn){btn.addEventListener('click',function(){var l=btn.getAttribute('data-lang');if(l===S.lang)return;S.lang=l;document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===l);});renderScene(S.sceneIdx,S.povId,true);});});
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('prev-btn').addEventListener('click',function(){if(S.sceneIdx>0){renderScene(S.sceneIdx-1,null,true);scrollTop();}});
document.getElementById('next-btn').addEventListener('click',function(){if(S.sceneIdx<SCENES.length-1){renderScene(S.sceneIdx+1,null,true);scrollTop();}});
document.getElementById('intel-toggle').addEventListener('click',function(){S.intelOpen=!S.intelOpen;document.getElementById('intel-body').classList.toggle('open',S.intelOpen);document.getElementById('intel-toggle').classList.toggle('open',S.intelOpen);});
document.getElementById('ledger-trigger').addEventListener('click',function(){S.ledgerOpen=!S.ledgerOpen;var sec=document.getElementById('ledger-section'),btn=document.getElementById('ledger-trigger');sec.classList.toggle('open',S.ledgerOpen);btn.classList.toggle('active',S.ledgerOpen);btn.textContent=S.ledgerOpen?ui('ledgerOpen'):ui('ledgerClosed');if(S.ledgerOpen){renderLedger();setTimeout(function(){sec.scrollIntoView({behavior:'smooth',block:'start'});},100);}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(S.sceneIdx<SCENES.length-1){renderScene(S.sceneIdx+1,null,true);scrollTop();}}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(S.sceneIdx>0){renderScene(S.sceneIdx-1,null,true);scrollTop();}}if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();var avail=Object.keys(SCENES[S.sceneIdx].povData);switchPov(avail[(avail.indexOf(S.povId)+1)%avail.length]);}});
renderScene(0,'dante',false);
</script>
</body>
</html>
